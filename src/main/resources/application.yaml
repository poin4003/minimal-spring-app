# Server config
server:
    port: ${PORT:8080}
    forward-headers-strategy: native
    tomcat:
        remoteip:
            remote-ip-header: X-Forwarded-For
            protocol-header: X-Forwarded-Proto

# App config
app:
    auth:
        credential-hash-secret: ${AUTH_CREDENTIAL_HASH_SECRET}
        cookie:
            access-token-name: ${ACCESS_TOKEN_COOKIE_NAME:ACCESS_TOKEN}
            refresh-token-name: ${REFRESH_TOKEN_COOKIE_NAME:REFRESH_TOKEN}
            path: ${AUTH_COOKIE_PATH:/}
            same-site: ${AUTH_COOKIE_SAME_SITE:Lax}
            secure: ${AUTH_COOKIE_SECURE:true}
        registration:
            otp-length: ${REGISTRATION_OTP_LENGTH:6}
            otp-ttl: ${REGISTRATION_OTP_TTL:10m}
            resend-cooldown: ${REGISTRATION_RESEND_COOLDOWN:1m}
            max-attempts: ${REGISTRATION_MAX_ATTEMPTS:5}
            completion-token-ttl: ${REGISTRATION_COMPLETION_TOKEN_TTL:20m}
            cleanup-retention: ${REGISTRATION_CLEANUP_RETENTION:1d}
        password-reset:
            otp-length: ${PASSWORD_RESET_OTP_LENGTH:6}
            otp-ttl: ${PASSWORD_RESET_OTP_TTL:10m}
            resend-cooldown: ${PASSWORD_RESET_RESEND_COOLDOWN:1m}
            max-attempts: ${PASSWORD_RESET_MAX_ATTEMPTS:5}
            reset-token-ttl: ${PASSWORD_RESET_TOKEN_TTL:20m}
            cleanup-retention: ${PASSWORD_RESET_CLEANUP_RETENTION:1d}
    cache:
        key-store:
            maximum-size: ${KEY_STORE_CACHE_MAXIMUM_SIZE:100000}
            ttl: ${KEY_STORE_CACHE_TTL:1m}
    cors:
        allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:3000}
    jwt:
        secret-key: ${JWT_SECRET_KEY}
        access-token-expiration-ms: ${JWT_ACCESS_TOKEN_EXPIRATION_MS:3600000}
        refresh-token-expiration-ms: ${JWT_REFRESH_TOKEN_EXPIRATION_MS:604800000}
    media:
        storage-path: ${MEDIA_STORAGE_PATH:./data/media}
        public-path: ${MEDIA_PUBLIC_PATH:/api/v1/public/media}
        delivery-cache-duration: ${MEDIA_DELIVERY_CACHE_DURATION:365d}
        max-image-pixels: ${MEDIA_MAX_IMAGE_PIXELS:40000000}
        thumbnail:
            enabled: ${MEDIA_THUMBNAIL_ENABLED:true}
            max-width: ${MEDIA_THUMBNAIL_MAX_WIDTH:480}
            max-height: ${MEDIA_THUMBNAIL_MAX_HEIGHT:480}
            jpeg-quality: ${MEDIA_THUMBNAIL_JPEG_QUALITY:0.82}
            video-frame-second: ${MEDIA_THUMBNAIL_VIDEO_FRAME_SECOND:1}
            audio-cover-enabled: ${MEDIA_THUMBNAIL_AUDIO_COVER_ENABLED:true}
        chunk-upload:
            chunk-size-bytes: ${MEDIA_CHUNK_SIZE_BYTES:8388608}
            direct-upload-threshold-bytes: ${MEDIA_DIRECT_UPLOAD_THRESHOLD_BYTES:16777216}
            parallel-chunks: ${MEDIA_PARALLEL_CHUNKS:3}
            max-active-sessions-per-user: ${MEDIA_MAX_ACTIVE_UPLOAD_SESSIONS_PER_USER:5}
            max-reserved-bytes-per-user: ${MEDIA_MAX_RESERVED_UPLOAD_BYTES_PER_USER:2147483648}
            session-ttl: ${MEDIA_UPLOAD_SESSION_TTL:24h}
            max-session-lifetime: ${MEDIA_UPLOAD_MAX_SESSION_LIFETIME:72h}
            completed-session-retention: ${MEDIA_COMPLETED_SESSION_RETENTION:24h}
        hls:
            audio-bitrate: ${MEDIA_HLS_AUDIO_BITRATE:192000}
            renditions:
                - key: 360p
                  height: 360
                  video-bitrate: 800000
                  audio-bitrate: 96000
                - key: 720p
                  height: 720
                  video-bitrate: 2800000
                  audio-bitrate: 128000
                - key: 1080p
                  height: 1080
                  video-bitrate: 5000000
                  audio-bitrate: 192000
        allowed-types:
            - extension: jpg
              kind: IMAGE
              max-file-size-bytes: 10485760
              content-types: [image/jpeg]
            - extension: jpeg
              kind: IMAGE
              max-file-size-bytes: 10485760
              content-types: [image/jpeg]
            - extension: png
              kind: IMAGE
              max-file-size-bytes: 10485760
              content-types: [image/png]
            - extension: mp4
              kind: VIDEO
              max-file-size-bytes: 1073741824
              content-types: [video/mp4]
            - extension: mp3
              kind: AUDIO
              max-file-size-bytes: 209715200
              content-types: [audio/mpeg]
            - extension: pdf
              kind: DOCUMENT
              max-file-size-bytes: 52428800
              content-types: [application/pdf]
            - extension: md
              kind: DOCUMENT
              max-file-size-bytes: 5242880
              content-types: [text/markdown, text/plain]
            - extension: zip
              kind: FILE
              max-file-size-bytes: 1073741824
              content-types: [application/zip]
        ffmpeg:
            executable: ${FFMPEG_PATH:ffmpeg}
            ffprobe-executable: ${FFPROBE_PATH:ffprobe}
            segment-duration-seconds: ${FFMPEG_SEGMENT_DURATION_SECONDS:6}
            process-timeout-minutes: ${FFMPEG_PROCESS_TIMEOUT_MINUTES:30}
        maintenance:
            pending-recovery-ttl: ${MEDIA_PENDING_RECOVERY_TTL:15m}
            staging-ttl: ${MEDIA_STAGING_TTL:1h}
            processing-workspace-ttl: ${MEDIA_PROCESSING_WORKSPACE_TTL:2h}
            failed-artifact-ttl: ${MEDIA_FAILED_ARTIFACT_TTL:24h}
            orphan-directory-ttl: ${MEDIA_ORPHAN_DIRECTORY_TTL:24h}
            missing-original-audit-ttl: ${MEDIA_MISSING_ORIGINAL_AUDIT_TTL:10m}
            batch-size: ${MEDIA_MAINTENANCE_BATCH_SIZE:100}
    notification:
        email:
            enabled: ${NOTIFICATION_EMAIL_ENABLED:false}
            from-address: ${NOTIFICATION_EMAIL_FROM:no-reply@example.com}
        policy:
            ttl: ${NOTIFICATION_TTL:30d}
            hard-limit-per-user: ${NOTIFICATION_HARD_LIMIT:100}
        telegram:
            enabled: ${NOTIFICATION_TELEGRAM_ENABLED:false}
            api-base-url: ${TELEGRAM_API_BASE_URL:https://api.telegram.org}
            bot-token: "${TELEGRAM_BOT_TOKEN:}"
            group-chat-id: "${TELEGRAM_GROUP_CHAT_ID:}"
        sse:
            connection-timeout: ${NOTIFICATION_SSE_TIMEOUT:30m}
            heartbeat-interval: ${NOTIFICATION_SSE_HEARTBEAT:20s}
    post:
        maintenance:
            deleted-retention: ${POST_DELETED_RETENTION:3d}
            rejected-retention: ${POST_REJECTED_RETENTION:3d}
    security:
        rate-limit:
            enabled: ${RATE_LIMIT_ENABLED:true}
            cache-max-size: ${RATE_LIMIT_CACHE_MAX_SIZE:100000}
            cache-expiration: ${RATE_LIMIT_CACHE_EXPIRATION:1h}
            auth-login: { capacity: 10, period: 1m }
            auth-refresh: { capacity: 60, period: 1m }
            registration-otp-ip:
                capacity: ${REGISTRATION_OTP_IP_RATE_CAPACITY:10}
                period: ${REGISTRATION_OTP_IP_RATE_PERIOD:10m}
            registration-otp-email:
                capacity: ${REGISTRATION_OTP_EMAIL_RATE_CAPACITY:5}
                period: ${REGISTRATION_OTP_EMAIL_RATE_PERIOD:15m}
            password-reset-otp-ip:
                capacity: ${PASSWORD_RESET_OTP_IP_RATE_CAPACITY:10}
                period: ${PASSWORD_RESET_OTP_IP_RATE_PERIOD:10m}
            password-reset-otp-email:
                capacity: ${PASSWORD_RESET_OTP_EMAIL_RATE_CAPACITY:5}
                period: ${PASSWORD_RESET_OTP_EMAIL_RATE_PERIOD:15m}
            password-reset-verify-ip:
                capacity: ${PASSWORD_RESET_VERIFY_IP_RATE_CAPACITY:30}
                period: ${PASSWORD_RESET_VERIFY_IP_RATE_PERIOD:10m}
            password-reset-verify-email:
                capacity: ${PASSWORD_RESET_VERIFY_EMAIL_RATE_CAPACITY:10}
                period: ${PASSWORD_RESET_VERIFY_EMAIL_RATE_PERIOD:10m}
            password-reset-complete-ip:
                capacity: ${PASSWORD_RESET_COMPLETE_IP_RATE_CAPACITY:30}
                period: ${PASSWORD_RESET_COMPLETE_IP_RATE_PERIOD:10m}
            registration-verify-ip:
                capacity: ${REGISTRATION_VERIFY_IP_RATE_CAPACITY:30}
                period: ${REGISTRATION_VERIFY_IP_RATE_PERIOD:10m}
            registration-verify-email:
                capacity: ${REGISTRATION_VERIFY_EMAIL_RATE_CAPACITY:10}
                period: ${REGISTRATION_VERIFY_EMAIL_RATE_PERIOD:10m}
            registration-complete-ip:
                capacity: ${REGISTRATION_COMPLETE_IP_RATE_CAPACITY:30}
                period: ${REGISTRATION_COMPLETE_IP_RATE_PERIOD:10m}
            media-direct-upload: { capacity: 30, period: 1m }
            media-upload-session: { capacity: 120, period: 1m }
            media-upload-chunk: { capacity: 300, period: 1m }
        api-public-paths:
            - /api/v1/auth/login
            - /api/v1/auth/refresh
            - /api/v1/auth/register/**
            - /api/v1/auth/password-reset/**
            - /api/v1/public/callback
            - "${app.media.public-path}/**"
        web-public-paths:
            - "${app.ui.social-path}"
            - "${app.ui.feed-path}"
            - "${app.ui.feed-path}/**"
            - /login
            - "${app.ui.registration-path}"
            - "${app.ui.registration-path}/**"
            - "${app.ui.forgot-password-path}"
            - "${app.ui.forgot-password-path}/**"
            - /logout
            - /error
            - /favicon.ico
            - /vendor/**
            - /swagger-ui.html
            - /swagger-ui/**
            - /v3/api-docs/**
            - /h2-console/**
            - /css/**
            - /js/**
            - /images/**
        csrf-ignore-paths:
            - /api/**
            - /h2-console/**
            - /admin/users/**
            - /admin/rbac/**
            - /admin/cronjobs/**
    ui:
        social-path: ${UI_SOCIAL_PATH:/}
        feed-path: ${UI_FEED_PATH:/posts}
        my-posts-path: ${UI_MY_POSTS_PATH:/my/posts}
        landing-path: ${UI_LANDING_PATH:/home}
        login-path: ${UI_LOGIN_PATH:/login}
        registration-path: ${UI_REGISTRATION_PATH:/register}
        forgot-password-path: ${UI_FORGOT_PASSWORD_PATH:/forgot-password}
        home-path: ${UI_HOME_PATH:/admin}
        profile-path: ${UI_PROFILE_PATH:/profile}
        notification-path: ${UI_NOTIFICATION_PATH:/notifications}
        logout-path: ${UI_LOGOUT_PATH:/logout}
        application-title: ${UI_APPLICATION_TITLE:Minimal Spring App}

# Spring config
spring:
    application:
        name: ${SPRING_APPLICATION_NAME:minimal-spring-app}

    messages:
        basename: i18n/messages
        encoding: UTF-8
        fallback-to-system-locale: false

    mail:
        host: ${MAIL_HOST:localhost}
        port: ${MAIL_PORT:1025}
        username: "${MAIL_USERNAME:}"
        password: "${MAIL_PASSWORD:}"
        properties:
            "[mail.smtp.auth]": ${MAIL_SMTP_AUTH:false}
            "[mail.smtp.starttls.enable]": ${MAIL_SMTP_STARTTLS:false}
            "[mail.smtp.connectiontimeout]": ${MAIL_CONNECTION_TIMEOUT_MS:5000}
            "[mail.smtp.timeout]": ${MAIL_READ_TIMEOUT_MS:5000}
            "[mail.smtp.writetimeout]": ${MAIL_WRITE_TIMEOUT_MS:5000}

    datasource:
        url: ${DATABASE_URL:jdbc:h2:file:./data/minimal_db}
        driver-class-name: ${DATABASE_DRIVER:org.h2.Driver}
        username: ${DATABASE_USERNAME:sa}
        password: "${DATABASE_PASSWORD:}"

    h2:
        console:
            enabled: ${H2_CONSOLE_ENABLED:false}
            path: ${H2_CONSOLE_PATH:/h2-console}

    flyway:
        enabled: ${FLYWAY_ENABLED:true}
        table: FLYWAY_SCHEMA_HISTORY
        placeholders:
            bootstrapAdminEmail: "${BOOTSTRAP_ADMIN_EMAIL:system@admin.com}"
            bootstrapAdminPasswordHash: "${BOOTSTRAP_ADMIN_PASSWORD_HASH}"
            bootstrapAdminName: "${BOOTSTRAP_ADMIN_NAME:System Administrator}"

    thymeleaf:
        enabled: true
        prefix: classpath:/templates/
        suffix: .html
        mode: HTML
        cache: ${THYMELEAF_CACHE:true}

    jpa:
        show-sql: ${JPA_SHOW_SQL:false}
        hibernate:
            ddl-auto: validate
        properties:
            hibernate:
                "[format_sql]": ${HIBERNATE_FORMAT_SQL:false}
                "[highlight_sql]": ${HIBERNATE_HIGHLIGHT_SQL:false}

    servlet:
        multipart:
            max-file-size: ${MULTIPART_MAX_FILE_SIZE:16MB}
            max-request-size: ${MULTIPART_MAX_REQUEST_SIZE:20MB}

    jackson:
        serialization:
            indent-output: true

    threads:
        virtual:
            enabled: true

# Swagger
springdoc:
    api-docs:
        enabled: ${SWAGGER_ENABLED:false}
    swagger-ui:
        enabled: ${SWAGGER_ENABLED:false}
        path: /swagger-ui.html

# Logger
logging:
    level:
        "[org.hibernate.SQL]": ${LOG_LEVEL_HIBERNATE_SQL:INFO}
        "[org.hibernate.orm.jdbc.bind]": ${LOG_LEVEL_HIBERNATE_BIND:INFO}
        "[org.springframework.jdbc.core]": ${LOG_LEVEL_SPRING_JDBC:INFO}
        "[java.sql.Connection]": ${LOG_LEVEL_SQL_CONNECTION:INFO}
        "[java.sql]": ${LOG_LEVEL_SQL:INFO}

org:
    jobrunr:
        background-job-server:
            enabled: true
            worker-count: ${JOBRUNR_WORKER_COUNT:2}
            poll-interval: ${JOBRUNR_POLL_INTERVAL:30s}
            delete-succeeded-jobs-after: ${JOBRUNR_DELETE_SUCCEEDED_AFTER:3d}
            permanently-delete-deleted-jobs-after: ${JOBRUNR_PERMANENT_DELETE_AFTER:1d}
        dashboard:
            enabled: ${JOBRUNR_DASHBOARD_ENABLED:false}
            port: ${JOBRUNR_DASHBOARD_PORT:8000}
        maintenance:
            failed-job-retention: ${JOBRUNR_FAILED_JOB_RETENTION:30d}
