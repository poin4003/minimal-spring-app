<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      th:lang="${#locale.language}">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title th:text="${page.title}">Sign in</title>
    <link rel="icon" href="/favicon.ico" type="image/x-icon">
    <script th:src="@{/js/app-ui.js}"></script>
    <script defer th:src="@{/vendor/alpine/alpine.min.js}"></script>
    <link rel="stylesheet" th:href="@{/vendor/bootstrap/css/bootstrap.min.css}">
    <link rel="stylesheet" th:href="@{/css/app-ui.css}">
</head>
<body class="app-auth-page">
    <div class="app-auth-tools">
        <div th:replace="~{fragments/app-tools :: themeToggle(null)}"></div>
    </div>

    <main class="container-fluid px-0">
        <div class="row g-0 app-auth-layout">
            <section class="col-lg-5 app-auth-intro">
                <div class="app-auth-intro-content">
                    <div class="app-auth-brand">
                        <img src="/favicon.ico"
                             alt=""
                             class="app-auth-brand-mark">
                        <span th:text="${page.applicationTitle}">
                            Vibe
                        </span>
                    </div>
                    <h1 class="app-auth-hero-title"
                        th:text="#{auth.login.hero(${page.applicationTitle})}">
                        Sign in to Vibe
                    </h1>
                </div>
            </section>

            <section class="col-lg-7 app-auth-form-column">
                <div class="app-surface-panel app-auth-panel">
                    <div class="app-auth-panel-body">
                            <h2 class="app-page-title" th:text="${page.title}">Sign in</h2>
                            <p class="text-secondary mb-4"
                               th:text="#{auth.login.description(${page.applicationTitle})}">
                                Use your system account to access Vibe.
                            </p>

                            <div class="alert alert-danger"
                                 th:if="${page.hasError}"
                                 th:text="#{auth.login.invalidCredentials}"
                                 role="alert">
                                Invalid email or password.
                            </div>

                            <div class="alert alert-success"
                                 th:if="${page.loggedOut}"
                                 th:text="#{auth.login.signedOut}"
                                 role="alert">
                                You have been signed out.
                            </div>

                            <div class="alert alert-success"
                                 th:if="${page.passwordReset}"
                                 th:text="#{auth.login.passwordResetSuccess}"
                                 role="alert">
                                Password reset successfully.
                            </div>

                            <form method="post" th:attr="action=${page.loginPath}" class="d-grid gap-3">
                                <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">

                                <div>
                                    <label for="email"
                                           class="form-label"
                                           th:text="#{field.email}">
                                        Email
                                    </label>
                                    <input
                                        id="email"
                                        type="email"
                                        name="email"
                                        class="form-control"
                                        autocomplete="username"
                                        required>
                                </div>

                                <div>
                                    <label for="password"
                                           class="form-label"
                                           th:text="#{field.password}">
                                        Password
                                    </label>
                                    <input
                                        id="password"
                                        type="password"
                                        name="password"
                                        class="form-control"
                                        autocomplete="current-password"
                                        required>
                                </div>

                                <div class="text-end">
                                    <a th:href="${page.forgotPasswordPath}"
                                       th:text="#{auth.login.forgotPassword}">
                                        Forgot password?
                                    </a>
                                </div>

                                <button type="submit"
                                        class="btn btn-primary"
                                        th:text="#{auth.login.submit}">
                                    Sign in
                                </button>
                            </form>

                            <p class="text-center text-secondary mt-4 mb-0">
                                <span th:text="#{auth.login.noAccount}">
                                    Need an account?
                                </span>
                                <a th:href="${page.registrationPath}"
                                   th:text="#{auth.login.register}">
                                   Create one
                                </a>
                            </p>
                    </div>
                </div>
            </section>
        </div>
    </main>
    <div th:replace="~{fragments/app-tools :: loader}"></div>
</body>
</html>
