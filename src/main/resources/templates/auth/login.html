<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      th:lang="${#locale.language}">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title th:text="${page.title}">Sign in</title>
    <link rel="icon" href="/favicon.ico" type="image/x-icon">
    <script th:src="@{/js/app-ui.js}"></script>
    <link rel="stylesheet" th:href="@{/vendor/bootstrap/css/bootstrap.min.css}">
    <link rel="stylesheet" th:href="@{/css/app-ui.css}">
</head>
<body class="bg-body-tertiary">
    <div class="position-fixed top-0 end-0 m-3 z-3">
        <div th:replace="~{fragments/app-tools :: themeToggle(null)}"></div>
    </div>

    <main class="min-vh-100 d-flex align-items-center py-5">
        <div class="container">
            <div class="row justify-content-center align-items-center g-4">
                <div class="col-lg-6">
                    <div class="pe-lg-5">
                        <p class="text-uppercase text-secondary fw-semibold small mb-3"
                           th:text="${page.applicationTitle}">
                            Minimal Spring App
                        </p>
                        <h1 class="display-5 fw-bold mb-3"
                            th:text="#{auth.login.hero(${page.applicationTitle})}">
                            Sign in to the Minimal Spring App
                        </h1>
                    </div>
                </div>

                <div class="col-lg-5">
                    <div class="card shadow-sm border-0">
                        <div class="card-body p-4 p-md-5">
                            <h2 class="h3 mb-2" th:text="${page.title}">Sign in</h2>
                            <p class="text-secondary mb-4"
                               th:text="#{auth.login.description(${page.applicationTitle})}">
                                Use your system account to access the Minimal Spring App.
                            </p>

                            <div class="alert alert-danger"
                                 th:if="${page.hasError}"
                                 th:text="#{auth.login.invalidCredentials}"
                                 role="alert">
                                Invalid email or password.
                            </div>

                            <div class="alert alert-success"
                                 th:if="${page.loggedOut}"
                                 th:text="#{auth.login.signedOut}"
                                 role="alert">
                                You have been signed out.
                            </div>

                            <form method="post" th:attr="action=${page.loginPath}" class="d-grid gap-3">
                                <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">

                                <div>
                                    <label for="email"
                                           class="form-label"
                                           th:text="#{field.email}">
                                        Email
                                    </label>
                                    <input
                                        id="email"
                                        type="email"
                                        name="email"
                                        class="form-control"
                                        autocomplete="username"
                                        required>
                                </div>

                                <div>
                                    <label for="password"
                                           class="form-label"
                                           th:text="#{field.password}">
                                        Password
                                    </label>
                                    <input
                                        id="password"
                                        type="password"
                                        name="password"
                                        class="form-control"
                                        autocomplete="current-password"
                                        required>
                                </div>

                                <button type="submit"
                                        class="btn btn-primary btn-lg"
                                        th:text="#{auth.login.submit}">
                                    Sign in
                                </button>
                            </form>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </main>
    <div th:replace="~{fragments/app-tools :: loader}"></div>
</body>
</html>
