<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      th:lang="${#locale.language}">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title th:text="${page.title}">Create account</title>
    <link rel="icon" href="/favicon.ico" type="image/x-icon">
    <script th:src="@{/js/app-ui.js}"></script>
    <link rel="stylesheet" th:href="@{/vendor/bootstrap/css/bootstrap.min.css}">
    <link rel="stylesheet" th:href="@{/css/app-ui.css}">
</head>
<body class="app-auth-page">
    <div class="app-auth-tools">
        <div th:replace="~{fragments/app-tools :: themeToggle(null)}"></div>
    </div>

    <main class="container-fluid px-0">
        <div class="row g-0 app-auth-layout">
            <section class="col-lg-5 app-auth-intro">
                <div class="app-auth-intro-content">
                    <div class="app-auth-brand">
                        <img src="/favicon.ico"
                             alt=""
                             class="app-auth-brand-mark">
                        <span th:text="${page.applicationTitle}">
                            Motumo
                        </span>
                    </div>
                    <h1 class="app-auth-hero-title"
                        th:text="#{auth.registration.hero(${page.applicationTitle})}">
                        Join Motumo
                    </h1>
                </div>
            </section>

            <section class="col-lg-7 app-auth-form-column">
                    <section id="registration-workspace"
                             th:fragment="registrationWorkspace"
                             class="app-surface-panel app-auth-panel">
                        <div class="app-auth-panel-body">
                            <h2 class="app-page-title"
                                th:text="${page.heading}">
                                Create your account
                            </h2>
                            <p class="text-secondary mb-4"
                               th:text="${page.description}">
                                Verify your email to continue.
                            </p>

                            <div class="alert alert-danger"
                                 th:if="${page.formError}"
                                 th:text="${page.formError}"
                                 role="alert">
                                Unable to continue registration.
                            </div>

                            <form th:if="${page.requestOtpStep}"
                                  method="post"
                                  th:action="${page.requestOtpPath}"
                                  th:object="${form}"
                                  th:attr="hx-post=${page.requestOtpPath}"
                                  hx-target="#registration-workspace"
                                  hx-swap="outerHTML"
                                  hx-disabled-elt="button"
                                  class="d-grid gap-3">
                                <input type="hidden"
                                       th:name="${_csrf.parameterName}"
                                       th:value="${_csrf.token}">

                                <div>
                                    <label for="registration-email"
                                           class="form-label"
                                           th:text="#{field.email}">
                                        Email
                                    </label>
                                    <input id="registration-email"
                                           type="email"
                                           class="form-control"
                                           th:classappend="${#fields.hasErrors('email')} ? 'is-invalid'"
                                           th:field="*{email}"
                                           autocomplete="email"
                                           required>
                                    <div class="invalid-feedback"
                                         th:errors="*{email}">
                                        Invalid email.
                                    </div>
                                </div>

                                <button type="submit"
                                        class="btn btn-primary"
                                        th:text="#{auth.registration.requestOtp.submit}">
                                    Send verification code
                                </button>
                            </form>

                            <form th:if="${page.verifyOtpStep}"
                                  method="post"
                                  th:action="${page.verifyOtpPath}"
                                  th:object="${form}"
                                  th:attr="hx-post=${page.verifyOtpPath}"
                                  hx-target="#registration-workspace"
                                  hx-swap="outerHTML"
                                  hx-disabled-elt="button"
                                  class="d-grid gap-3">
                                <input type="hidden"
                                       th:name="${_csrf.parameterName}"
                                       th:value="${_csrf.token}">
                                <input type="hidden" th:field="*{email}">

                                <div class="alert alert-info mb-0"
                                     th:text="#{auth.registration.verifyOtp.sentTo(${form.email})}">
                                    A verification code was sent to your email.
                                </div>

                                <div>
                                    <label for="registration-code"
                                           class="form-label"
                                           th:text="#{field.verificationCode}">
                                        Verification code
                                    </label>
                                    <input id="registration-code"
                                           type="text"
                                           inputmode="numeric"
                                           class="form-control"
                                           th:classappend="${#fields.hasErrors('code')} ? 'is-invalid'"
                                           th:field="*{code}"
                                           autocomplete="one-time-code"
                                           required>
                                    <div class="invalid-feedback"
                                         th:errors="*{code}">
                                        Invalid verification code.
                                    </div>
                                </div>

                                <button type="submit"
                                        class="btn btn-primary"
                                        th:text="#{auth.registration.verifyOtp.submit}">
                                    Verify email
                                </button>
                            </form>

                            <form th:if="${page.completeStep}"
                                  method="post"
                                  th:action="${page.completePath}"
                                  th:object="${form}"
                                  th:attr="hx-post=${page.completePath}"
                                  hx-target="#registration-workspace"
                                  hx-swap="outerHTML"
                                  hx-disabled-elt="button"
                                  class="d-grid gap-3">
                                <input type="hidden"
                                       th:name="${_csrf.parameterName}"
                                       th:value="${_csrf.token}">
                                <input type="hidden"
                                       th:field="*{completionToken}">

                                <div>
                                    <label for="registration-password"
                                           class="form-label"
                                           th:text="#{field.password}">
                                        Password
                                    </label>
                                    <input id="registration-password"
                                           type="password"
                                           class="form-control"
                                           th:classappend="${#fields.hasErrors('password')} ? 'is-invalid'"
                                           th:field="*{password}"
                                           autocomplete="new-password"
                                           required>
                                    <div class="form-text"
                                         th:text="#{auth.registration.complete.passwordHint}">
                                        Use between 8 and 72 characters.
                                    </div>
                                    <div class="invalid-feedback"
                                         th:errors="*{password}">
                                        Invalid password.
                                    </div>
                                </div>

                                <button type="submit"
                                        class="btn btn-primary"
                                        th:text="#{auth.registration.complete.submit}">
                                    Create account
                                </button>
                            </form>

                            <p class="text-center text-secondary mt-4 mb-0">
                                <span th:text="#{auth.registration.hasAccount}">
                                    Already have an account?
                                </span>
                                <a th:href="${page.loginPath}"
                                   th:text="#{auth.registration.signIn}">
                                    Sign in
                                </a>
                            </p>
                        </div>
                    </section>
            </section>
        </div>
    </main>

    <div th:replace="~{fragments/app-tools :: loader}"></div>
    <th:block th:replace="~{fragments/app-tools :: frontendScripts}"></th:block>
</body>
</html>
