<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" th:lang="${#locale.language}">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title th:text="${page.title}">Role Permissions</title>
    <link rel="icon" href="/favicon.ico" type="image/x-icon">
    <script th:src="@{/js/app-ui.js}"></script>
    <link rel="stylesheet" th:href="@{/vendor/bootstrap/css/bootstrap.min.css}">
    <link rel="stylesheet" th:href="@{/css/app-ui.css}">
    <link rel="stylesheet" th:href="@{/css/shell.css}">
    <th:block th:replace="~{fragments/app-tools :: htmxScripts}"></th:block>
    <script defer th:src="@{/vendor/bootstrap/js/bootstrap.bundle.min.js}"></script>
</head>
<body class="app-shell bg-body-tertiary">
    <div th:replace="~{fragments/app-shell
            :: layout(${page.shell}, ~{::pageContent})}">
        <th:block th:fragment="pageContent">
            <div class="d-grid gap-4">
                            <div th:replace="~{fragments/components/breadcrumb
                                    :: breadcrumb(${page.breadcrumb})}"></div>

                            <div id="role-permission-assignment-workspace" class="d-grid gap-4">
                            <section class="d-flex flex-column flex-lg-row align-items-lg-center justify-content-lg-between gap-3">
                                <div>
                                    <p class="text-secondary mb-2"
                                       th:text="#{home.rbac.title}">
                                        RBAC
                                    </p>
                                    <h2 class="h3 mb-2" th:text="${page.heading}">Role Permissions</h2>
                                    <p class="text-secondary mb-2" th:text="${page.description}">
                                        Manage permissions for the selected role.
                                    </p>
                                    <div class="small text-secondary d-flex flex-wrap gap-3">
                                        <span th:each="item : ${page.metadataItems}">
                                            <span th:text="${item.label + ': '}">Label: </span>
                                            <code th:if="${item.monospace}" th:text="${item.value}">value</code>
                                            <span th:unless="${item.monospace}" th:text="${item.value}">value</span>
                                        </span>
                                    </div>
                                </div>

                                <div class="d-flex flex-wrap gap-2">
                                    <a th:href="${page.backPath}"
                                       class="btn btn-outline-secondary"
                                       th:text="#{action.back}">
                                        Back
                                    </a>
                                    <a th:href="${page.assignedPath}"
                                       class="btn"
                                       th:attr="hx-get=${page.assignedPath},
                                                hx-target='#role-permission-assignment-workspace',
                                                hx-select='#role-permission-assignment-workspace',
                                                hx-swap='outerHTML',
                                                hx-push-url='true',
                                                hx-disabled-elt='this'"
                                       th:classappend="${page.assignedMode ? ' btn-primary' : ' btn-outline-primary'}">
                                        Assigned
                                    </a>
                                    <a th:href="${page.availablePath}"
                                       class="btn"
                                       th:attr="hx-get=${page.availablePath},
                                                hx-target='#role-permission-assignment-workspace',
                                                hx-select='#role-permission-assignment-workspace',
                                                hx-swap='outerHTML',
                                                hx-push-url='true',
                                                hx-disabled-elt='this'"
                                       th:classappend="${!page.assignedMode ? ' btn-primary' : ' btn-outline-primary'}">
                                        Available
                                    </a>
                                </div>
                            </section>

                            <div th:if="${page.errorMessage != null}"
                                 class="alert alert-danger mb-0"
                                 th:text="${page.errorMessage}">
                                Unexpected error.
                            </div>

                            <div th:replace="~{fragments/components/assignment-panel :: panel(${page.assignmentPanel})}"></div>
                            </div>
            </div>
        </th:block>
    </div>
</body>
</html>
