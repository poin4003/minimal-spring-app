<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" th:lang="${#locale.language}">
<head>
    <title th:text="${page.title}">Roles</title>
    <th:block th:replace="~{fragments/app-tools :: adminHead}"></th:block>
</head>
<body class="app-shell bg-body-tertiary">
    <div th:replace="~{fragments/app-shell
            :: layout(${page.shell}, 'app-shell bg-body-tertiary', ~{::pageContent})}">
        <th:block th:fragment="pageContent">
            <div class="app-page-stack">
                            <div th:if="${page.createRoleModal != null}"
                                 class="app-page-toolbar">
                                <div th:replace="~{fragments/components/modal :: modal(${page.createRoleModal})}"></div>
                            </div>

                            <div th:if="${page.errorMessage != null}"
                                 class="alert app-error-alert mb-0"
                                 th:text="${page.errorMessage}">
                                Please correct the form and try again.
                            </div>

                            <div th:replace="~{fragments/components/table :: table(${page.roleTable})}"></div>

                            <th:block th:if="${page.metadataModal != null}">
                                <div th:replace="~{fragments/components/metadata-modal :: modal(${page.metadataModal})}"></div>
                            </th:block>

                            <th:block th:if="${page.detailModal != null}">
                                <div th:replace="~{fragments/components/modal :: modal(${page.detailModal})}"></div>
                            </th:block>
            </div>
        </th:block>
    </div>

    <th:block th:if="${page.openCreateRoleModal}">
        <div th:replace="~{fragments/app-tools
                :: autoModal('create-role-modal')}"></div>
    </th:block>
    <th:block th:if="${page.openMetadataModal}">
        <div th:replace="~{fragments/app-tools
                :: autoModal('role-metadata-modal')}"></div>
    </th:block>
    <th:block th:if="${page.openDetailModal}">
        <div th:replace="~{fragments/app-tools
                :: autoModal('role-detail-modal')}"></div>
    </th:block>
</body>
</html>
