<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<body>
<div th:fragment="modal(upload)"
     class="modal fade"
     tabindex="-1"
     aria-hidden="true"
     data-media-upload
     th:data-message-status-queued="#{media.upload.status.queued}"
     th:data-message-status-uploading="#{media.upload.status.uploading}"
     th:data-message-status-uploaded="#{media.upload.status.uploaded}"
     th:data-message-status-failed="#{media.upload.status.failed}"
     th:data-message-status-cancelled="#{media.upload.status.cancelled}"
     th:data-message-transport-chunked="#{media.upload.transport.chunked}"
     th:data-message-transport-resumable="#{media.upload.transport.resumable}"
     th:data-message-transport-direct="#{media.upload.transport.direct}"
     th:data-message-file-empty="#{media.upload.error.fileEmpty}"
     th:data-message-extension-not-allowed="#{media.upload.error.extensionNotAllowed}"
     th:data-message-file-too-large="#{media.upload.error.fileTooLarge}"
     th:data-message-upload-cancelled="#{media.upload.error.cancelled}"
     th:data-message-session-cancel-failed="#{media.upload.error.sessionCancelFailed}"
     th:data-message-chunk-failed="#{media.upload.error.chunkFailed}"
     th:data-message-upload-success="#{media.upload.success}"
     th:data-message-auth-expired="#{media.upload.error.authExpired}"
     th:data-message-upload-failed="#{media.upload.error.failed}"
     th:data-message-request-failed="#{media.upload.error.requestFailed}"
     th:data-message-auth-required="#{error.auth.required}"
     th:data-message-session-not-resumable="#{media.upload.error.sessionNotResumable}"
     th:data-message-file-mismatch="#{media.upload.error.fileMismatch}"
     th:id="${upload.id + '-modal'}">
    <div class="modal-dialog modal-lg modal-dialog-scrollable">
        <form class="modal-content"
              method="POST"
              enctype="multipart/form-data"
              data-media-upload-form
              data-app-loader="manual"
              th:action="${upload.transport.directUploadPath}"
              th:data-chunk-upload-path="${upload.transport.chunkUploadPath}"
              th:data-direct-upload-threshold="${upload.transport.directUploadThresholdBytes}"
              th:data-parallel-chunks="${upload.transport.parallelChunks}"
              th:data-csrf-header="${_csrf.headerName}"
              th:data-csrf-token="${_csrf.token}">
            <div class="modal-header">
                <div>
                    <h2 class="modal-title fs-5" th:text="${upload.title}">
                        Upload Media
                    </h2>
                    <p class="text-secondary small mb-0"
                       th:text="${upload.description}">
                        Select files to add to the media library.
                    </p>
                </div>
                <button type="button"
                        class="btn-close"
                        data-bs-dismiss="modal"
                        th:aria-label="#{action.close}"></button>
            </div>

            <div class="modal-body d-grid gap-3">
                <label class="app-media-upload-dropzone rounded p-4 text-center"
                       data-media-upload-dropzone
                       tabindex="0"
                       th:for="${upload.id + '-file'}">
                    <span class="d-block fw-semibold"
                          th:text="#{media.upload.dropzone}">
                        Drop files here or browse
                    </span>
                    <span class="d-block text-secondary small mt-1"
                          th:text="#{media.upload.chunkHint}">
                        Large files use resumable chunk upload automatically.
                    </span>
                </label>

                <input class="visually-hidden"
                       type="file"
                       name="file"
                       data-media-upload-input
                       th:id="${upload.id + '-file'}"
                       th:accept="${upload.accept}"
                       th:multiple="${upload.multiple}">

                <div class="d-flex flex-wrap gap-2"
                     th:aria-label="#{media.upload.allowedTypes}">
                    <span th:each="rule : ${upload.rules}"
                          class="badge text-bg-secondary"
                          th:text="${'.' + rule.extension + ' | ' + rule.kind.name()}">
                        .png | IMAGE
                    </span>
                </div>

                <span th:each="rule : ${upload.rules}"
                      data-media-upload-rule
                      th:data-extension="${rule.extension}"
                      th:data-max-file-size="${rule.maxFileSizeBytes}"
                      hidden></span>

                <div class="border rounded">
                    <div class="p-3 text-secondary text-center"
                         data-media-upload-empty
                         th:text="#{media.upload.emptyQueue}">
                        No files selected.
                    </div>
                    <div class="list-group list-group-flush"
                         data-media-upload-queue></div>
                </div>

                <template data-media-upload-item-template>
                    <div class="list-group-item p-3" data-upload-item>
                        <div class="d-flex align-items-start justify-content-between gap-3">
                            <div class="flex-grow-1 overflow-hidden">
                                <div class="fw-semibold text-break" data-upload-name></div>
                                <div class="small text-secondary" data-upload-size></div>
                            </div>
                            <span class="badge text-bg-secondary" data-upload-status>
                                <span th:text="#{media.upload.status.queued}">
                                    Queued
                                </span>
                            </span>
                        </div>

                        <div class="progress mt-3"
                             role="progressbar"
                             th:aria-label="#{media.upload.progress}"
                             aria-valuemin="0"
                             aria-valuemax="100"
                             aria-valuenow="0">
                            <div class="progress-bar"
                                 data-upload-progress
                                 style="width: 0%"></div>
                        </div>

                        <div class="mt-3" data-upload-result hidden></div>

                        <div class="d-flex flex-wrap justify-content-end gap-2 mt-3">
                            <button type="button"
                                    class="btn btn-sm btn-outline-secondary"
                                    data-upload-action="cancel"
                                    th:text="#{action.cancel}">
                                Cancel
                            </button>
                            <button type="button"
                                    class="btn btn-sm btn-outline-primary"
                                    data-upload-action="retry"
                                    hidden
                                    th:text="#{action.retry}">
                                Retry
                            </button>
                            <button type="button"
                                    class="btn btn-sm btn-outline-danger"
                                    data-upload-action="remove"
                                    th:text="#{action.remove}">
                                Remove
                            </button>
                        </div>
                    </div>
                </template>
            </div>

            <div class="modal-footer">
                <button type="button"
                        class="btn btn-outline-secondary me-auto"
                        data-media-upload-clear
                        th:text="#{media.upload.clearCompleted}">
                    Clear completed
                </button>
                <button type="button"
                        class="btn btn-outline-secondary"
                        data-bs-dismiss="modal"
                        th:text="#{action.close}">
                    Close
                </button>
                <button type="submit"
                        class="btn btn-primary"
                        data-media-upload-start
                        th:text="${upload.submitLabel}">
                    Upload queued
                </button>
            </div>
        </form>
    </div>
</div>
</body>
</html>
