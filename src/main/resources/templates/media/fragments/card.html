<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<body>
<article th:fragment="card(item)"
         class="card h-100 overflow-hidden position-relative">
    <div class="ratio ratio-4x3 bg-body-tertiary border-bottom position-relative">
        <div class="position-absolute top-0 start-0 w-100 h-100
                    d-flex flex-column align-items-center justify-content-center">
            <img class="mb-3 opacity-75"
                 th:src="${item.fallbackImagePath}"
                 alt=""
                 width="64"
                 height="64"
                 aria-hidden="true">
            <strong class="h5 mb-1" th:text="${item.kind}">VIDEO</strong>
            <span class="small text-secondary" th:text="${item.processingStatus}">
                PENDING
            </span>
        </div>

        <img th:if="${item.hasThumbnail()}"
             class="position-absolute top-0 start-0 w-100 h-100 object-fit-cover"
             th:src="${item.thumbnailUrl}"
             th:alt="${item.originalName}"
             data-media-thumbnail
             loading="lazy"
             decoding="async">

        <span th:if="${item.processingStatus.name() == 'PENDING'}"
              class="spinner-border spinner-border-sm text-primary
                     position-absolute top-0 end-0 m-3 z-2"
              role="status">
            <span class="visually-hidden">Processing</span>
        </span>
    </div>

    <div class="card-body">
        <h3 class="h6 text-truncate mb-2"
            th:title="${item.originalName}">
            <a th:if="${item.canPreview()}"
               class="stretched-link text-reset text-decoration-none"
               th:href="${item.previewPath}"
               th:text="${item.originalName}"
               th:attr="hx-get=${item.previewPartialPath},
                        hx-target='#app-modal-host',
                        hx-swap='innerHTML',
                        hx-disabled-elt='this',
                        data-app-modal-request='true'">
                image.jpg
            </a>
            <span th:unless="${item.canPreview()}"
                  th:text="${item.originalName}">
                archive.zip
            </span>
        </h3>

        <p class="small text-secondary text-truncate mb-3"
           th:title="${item.createdByEmail}"
           th:text="${item.createdByEmail != null ? item.createdByEmail : '-'}">
            user@example.com
        </p>

        <div class="d-flex flex-wrap gap-2 mb-3">
            <span class="badge text-bg-primary" th:text="${item.kind}">IMAGE</span>
            <span class="badge"
                  th:classappend="${item.processingStatus.name() == 'READY'
                      ? ' text-bg-success'
                      : item.processingStatus.name() == 'FAILED'
                          ? ' text-bg-danger'
                          : ' text-bg-warning'}"
                  th:text="${item.processingStatus}">
                READY
            </span>
            <span class="badge"
                  th:classappend="${item.status.name() == 'ACTIVE'
                      ? ' text-bg-success'
                      : ' text-bg-secondary'}"
                  th:text="${item.status}">
                ACTIVE
            </span>
        </div>

        <dl class="row small mb-0">
            <dt class="col-5">Size</dt>
            <dd class="col-7 text-end" th:text="${item.fileSizeLabel}">1.2 MB</dd>
            <dt class="col-5">Created</dt>
            <dd class="col-7 text-end text-truncate"
                th:title="${item.createdAt}"
                th:text="${item.createdAt}">
                2026-07-22
            </dd>
        </dl>
    </div>

    <div class="card-footer bg-transparent position-relative z-2">
        <div class="btn-group btn-group-sm"
             role="group"
             aria-label="Media actions">
            <a class="btn btn-outline-secondary app-icon-button"
               th:href="${item.metadataPath}"
               title="Metadata"
               aria-label="Metadata"
               th:attr="hx-get=${item.metadataPartialPath},
                        hx-target='#app-modal-host',
                        hx-swap='innerHTML',
                        hx-disabled-elt='this',
                        data-app-modal-request='true'">
                <i class="bi bi-info-circle" aria-hidden="true"></i>
                <span class="visually-hidden">Metadata</span>
            </a>
            <a th:if="${item.canSelectThumbnail()}"
               class="btn btn-outline-primary app-icon-button"
               th:href="${item.thumbnailSelectionPath}"
               title="Select thumbnail"
               aria-label="Select thumbnail">
                <i class="bi bi-image" aria-hidden="true"></i>
                <span class="visually-hidden">Select thumbnail</span>
            </a>
            <a th:if="${item.canDownload()}"
               class="btn btn-outline-success app-icon-button"
               th:href="${item.downloadPath}"
               th:attr="download=${item.originalName}"
               title="Download"
               aria-label="Download">
                <i class="bi bi-download" aria-hidden="true"></i>
                <span class="visually-hidden">Download</span>
            </a>
            <a th:if="${item.canRetry()}"
               class="btn btn-outline-warning app-icon-button"
               th:href="${item.retryPath}"
               title="Retry processing"
               aria-label="Retry processing"
               th:attr="hx-get=${item.retryPartialPath},
                        hx-target='#app-modal-host',
                        hx-swap='innerHTML',
                        hx-disabled-elt='this',
                        data-app-modal-request='true'">
                <i class="bi bi-arrow-clockwise" aria-hidden="true"></i>
                <span class="visually-hidden">Retry processing</span>
            </a>
            <a class="btn btn-outline-danger app-icon-button"
               th:href="${item.deletePath}"
               title="Delete"
               aria-label="Delete"
               th:attr="hx-get=${item.deletePartialPath},
                        hx-target='#app-modal-host',
                        hx-swap='innerHTML',
                        hx-disabled-elt='this',
                        data-app-modal-request='true'">
                <i class="bi bi-trash" aria-hidden="true"></i>
                <span class="visually-hidden">Delete</span>
            </a>
        </div>
    </div>
</article>
</body>
</html>
