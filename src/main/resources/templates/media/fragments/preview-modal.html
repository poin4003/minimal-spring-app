<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<body>
<div th:fragment="modal(modal)"
     class="modal fade"
     tabindex="-1"
     aria-hidden="true"
     data-media-preview-modal
     th:data-message-source-unavailable="#{media.preview.sourceUnavailable}"
     th:data-message-player-unavailable="#{media.preview.playerUnavailable}"
     th:data-message-stream-failed="#{media.preview.streamFailed}"
     th:id="${modal.id}">
    <div class="modal-dialog modal-xl modal-dialog-centered modal-dialog-scrollable">
        <div class="modal-content">
            <div class="modal-header">
                <div>
                    <h2 class="modal-title fs-5" th:text="${modal.title}">Media Preview</h2>
                    <p class="text-secondary small mb-0 mt-1" th:text="${modal.description}">
                        image.jpg | IMAGE | 1.2 MB
                    </p>
                </div>
                <button type="button"
                        class="btn-close"
                        data-bs-dismiss="modal"
                        th:aria-label="#{action.close}"></button>
            </div>

            <div class="modal-body bg-body-tertiary"
                 th:switch="${modal.previewType.name()}">
                <div th:case="'IMAGE'"
                     class="d-flex align-items-center justify-content-center p-3">
                    <img class="img-fluid rounded bg-black app-media-preview-content"
                         th:src="${modal.sourceUrl}"
                         th:alt="${modal.description}">
                </div>

                <div th:case="'VIDEO'"
                     class="app-media-preview-player d-flex flex-column align-items-center justify-content-center p-3"
                     data-media-preview-player>
                    <video class="video-js vjs-big-play-centered app-media-preview-video"
                           controls
                           playsinline
                           preload="metadata"
                           data-video-player
                           th:attr="data-video-source=${modal.sourceUrl},
                                    data-media-progress-id=${modal.mediaId}"></video>

                    <div class="alert alert-danger w-100 mt-3 mb-0" data-video-error hidden></div>
                </div>

                <div th:case="'AUDIO'"
                     class="d-flex flex-column align-items-center justify-content-center py-5 px-3"
                     data-media-preview-player>
                    <audio class="video-js app-media-preview-audio w-100"
                           controls
                           preload="metadata"
                           data-video-player
                           th:attr="data-video-source=${modal.sourceUrl}"></audio>
                    <div class="alert alert-danger w-100 mt-3 mb-0" data-video-error hidden></div>
                </div>

                <div th:case="'UNAVAILABLE'"
                     class="app-media-preview-message d-flex align-items-center justify-content-center text-center p-4">
                    <p class="text-secondary mb-0" th:text="${modal.unavailableMessage}">
                        Preview is not available yet.
                    </p>
                </div>
            </div>

            <div th:if="${modal.originalUrl != null}" class="modal-footer">
                <a class="btn btn-outline-primary"
                   th:href="${modal.originalUrl}"
                   target="_blank"
                   rel="noopener">
                    <span th:text="#{media.preview.openOriginal}">
                        Open Original
                    </span>
                </a>
            </div>
        </div>
    </div>
</div>
</body>
</html>
