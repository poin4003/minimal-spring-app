<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" th:lang="${#locale.language}">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title th:text="${page.title}">Media Library</title>
    <link rel="icon" href="/favicon.ico" type="image/x-icon">
    <script th:src="@{/js/app-ui.js}"></script>
    <link rel="stylesheet" th:href="@{/vendor/bootstrap/css/bootstrap.min.css}">
    <link rel="stylesheet" th:href="@{/vendor/bootstrap-icons/font/bootstrap-icons.min.css}">
    <link rel="stylesheet" th:href="@{/vendor/video.js/video-js.min.css}">
    <link rel="stylesheet" th:href="@{/css/app-ui.css}">
    <link rel="stylesheet" th:href="@{/css/shell.css}">
    <th:block th:replace="~{fragments/app-tools :: frontendScripts}"></th:block>
    <script defer th:src="@{/vendor/bootstrap/js/bootstrap.bundle.min.js}"></script>
    <script defer th:src="@{/vendor/video.js/video.min.js}"></script>
    <script defer th:src="@{/vendor/video.js/videojs-contrib-quality-levels.min.js}"></script>
    <script defer th:src="@{/vendor/video.js/videojs-hls-quality-selector.min.js}"></script>
    <script type="module" th:src="@{/js/media-upload.js}"></script>
    <script defer th:src="@{/js/media-gallery.js}"></script>
    <script defer th:src="@{/js/media-preview.js}"></script>
    <script defer th:src="@{/js/app-modal.js}"></script>
</head>
<body class="app-shell bg-body-tertiary">
    <div th:replace="~{fragments/app-shell
            :: layout(${page.shell}, ~{::pageContent})}">
        <th:block th:fragment="pageContent">
            <div class="app-page-stack">
                            <div th:replace="~{media/fragments/upload :: upload(${page.uploadComponent})}"></div>

                            <div id="media-library-workspace" class="app-page-stack">
                            <section class="app-filter-panel app-component">
                                <div class="app-section-header">
                                    <h2 class="app-section-title" th:text="#{media.filter.title}">
                                        Filter Media
                                    </h2>
                                </div>
                                <div class="app-section-body">

                                    <form method="get"
                                          th:attr="action=${page.listPath},
                                                   hx-get=${page.listPath},
                                                   hx-target='#media-library-workspace',
                                                   hx-select='#media-library-workspace',
                                                   hx-swap='outerHTML',
                                                   hx-push-url='false',
                                                   hx-replace-url='true',
                                                   hx-disabled-elt='button[type=submit]'"
                                          class="row g-3 align-items-end">
                                        <input type="hidden" name="page" value="0">
                                        <input type="hidden" name="size" th:value="${page.query.size}">
                                        <input type="hidden" name="sortBy" th:value="${page.query.sortBy}">
                                        <input type="hidden" name="sortDirection" th:value="${page.query.sortDirection}">

                                        <div class="col-12 col-lg-4">
                                            <label for="media-original-name"
                                                   class="form-label"
                                                   th:text="#{field.originalName}">
                                                Original Name
                                            </label>
                                            <input id="media-original-name"
                                                   name="originalName"
                                                   type="text"
                                                   class="form-control"
                                                   maxlength="255"
                                                   th:placeholder="#{media.filter.originalNamePlaceholder}"
                                                   th:value="${page.filter.originalName}">
                                        </div>

                                        <div class="col-12 col-lg-4">
                                            <label for="media-public-key"
                                                   class="form-label"
                                                   th:text="#{field.publicKey}">
                                                Public Key
                                            </label>
                                            <input id="media-public-key"
                                                   name="publicKey"
                                                   type="text"
                                                   class="form-control"
                                                   maxlength="64"
                                                   th:placeholder="#{media.filter.publicKeyPlaceholder}"
                                                   th:value="${page.filter.publicKey}">
                                        </div>

                                        <div class="col-12 col-lg-4">
                                            <label for="media-created-by"
                                                   class="form-label"
                                                   th:text="#{field.createdByEmail}">
                                                Created By Email
                                            </label>
                                            <input id="media-created-by"
                                                   name="createdByEmail"
                                                   type="text"
                                                   class="form-control"
                                                   maxlength="255"
                                                   th:placeholder="#{media.filter.createdByEmailPlaceholder}"
                                                   th:value="${page.filter.createdByEmail}">
                                        </div>

                                        <div class="col-12 col-md-4">
                                            <label for="media-kind"
                                                   class="form-label"
                                                   th:text="#{field.kind}">
                                                Kind
                                            </label>
                                            <select id="media-kind" name="kind" class="form-select">
                                                <option value="" th:text="#{media.filter.allKinds}">
                                                    All kinds
                                                </option>
                                                <option th:each="kind : ${page.kinds}"
                                                        th:value="${kind.name()}"
                                                        th:selected="${kind == page.filter.kind}"
                                                        th:text="${kind.name()}">
                                                    IMAGE
                                                </option>
                                            </select>
                                        </div>

                                        <div class="col-12 col-md-4">
                                            <label for="media-processing-status"
                                                   class="form-label"
                                                   th:text="#{field.processingStatus}">
                                                Processing
                                            </label>
                                            <select id="media-processing-status" name="processingStatus" class="form-select">
                                                <option value=""
                                                        th:text="#{media.filter.allProcessingStatuses}">
                                                    All processing states
                                                </option>
                                                <option th:each="processingStatus : ${page.processingStatuses}"
                                                        th:value="${processingStatus.name()}"
                                                        th:selected="${processingStatus == page.filter.processingStatus}"
                                                        th:text="${processingStatus.name()}">
                                                    READY
                                                </option>
                                            </select>
                                        </div>

                                        <div class="col-12 col-md-4">
                                            <label for="media-status"
                                                   class="form-label"
                                                   th:text="#{field.status}">
                                                Status
                                            </label>
                                            <select id="media-status" name="status" class="form-select">
                                                <option value="" th:text="#{media.filter.allStatuses}">
                                                    All statuses
                                                </option>
                                                <option th:each="status : ${page.statuses}"
                                                        th:value="${status.name()}"
                                                        th:selected="${status == page.filter.status}"
                                                        th:text="${status.name()}">
                                                    ACTIVE
                                                </option>
                                            </select>
                                        </div>

                                        <div class="col-12 app-page-toolbar">
                                            <a class="btn btn-outline-secondary"
                                               th:href="${page.listPath}"
                                               th:attr="hx-get=${page.listPath},
                                                        hx-target='#media-library-workspace',
                                                        hx-select='#media-library-workspace',
                                                        hx-swap='outerHTML',
                                                        hx-push-url='false',
                                                        hx-replace-url='true',
                                                        hx-disabled-elt='this'">
                                                <span th:text="#{action.clear}">Clear</span>
                                            </a>
                                            <button type="submit"
                                                    class="btn btn-primary"
                                                    th:text="#{action.applyFilters}">
                                                Apply Filters
                                            </button>
                                        </div>
                                    </form>
                                </div>
                            </section>

                            <div th:replace="~{media/fragments/gallery :: gallery(${page.mediaGallery})}"></div>
                            </div>

                            <th:block th:if="${page.previewModal != null}">
                                <div th:replace="~{media/fragments/preview-modal :: modal(${page.previewModal})}"></div>
                            </th:block>

                            <th:block th:if="${page.metadataModal != null}">
                                <div th:replace="~{fragments/components/metadata-modal :: modal(${page.metadataModal})}"></div>
                            </th:block>

                            <th:block th:if="${page.deleteModal != null}">
                                <div th:replace="~{fragments/components/confirm-modal :: modal(${page.deleteModal})}"></div>
                            </th:block>

                            <th:block th:if="${page.retryModal != null}">
                                <div th:replace="~{fragments/components/confirm-modal :: modal(${page.retryModal})}"></div>
                            </th:block>
            </div>
        </th:block>
    </div>

    <div th:if="${page.openPreviewModal}"
         th:replace="~{fragments/app-tools
                :: autoModal('media-preview-modal')}"></div>
    <div th:if="${page.openMetadataModal}"
         th:replace="~{fragments/app-tools
                :: autoModal('media-metadata-modal')}"></div>
    <div th:if="${page.openDeleteModal}"
         th:replace="~{fragments/app-tools
                :: autoModal('media-delete-modal')}"></div>
    <div th:if="${page.openRetryModal}"
         th:replace="~{fragments/app-tools
                :: autoModal('media-retry-modal')}"></div>
</body>
</html>
