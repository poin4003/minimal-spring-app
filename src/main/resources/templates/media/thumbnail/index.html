<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" th:lang="${#locale.language}">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title th:text="${page.title}">Select Thumbnail</title>
    <link rel="icon" href="/favicon.ico" type="image/x-icon">
    <script th:src="@{/js/app-ui.js}"></script>
    <link rel="stylesheet" th:href="@{/vendor/bootstrap/css/bootstrap.min.css}">
    <link rel="stylesheet" th:href="@{/css/app-ui.css}">
    <link rel="stylesheet" th:href="@{/css/shell.css}">
    <th:block th:replace="~{fragments/app-tools :: htmxScripts}"></th:block>
    <script defer th:src="@{/vendor/bootstrap/js/bootstrap.bundle.min.js}"></script>
    <script type="module" th:src="@{/js/media-upload.js}"></script>
    <script defer th:src="@{/js/media-gallery.js}"></script>
    <script defer th:src="@{/js/app-modal.js}"></script>
</head>
<body class="app-shell bg-body-tertiary">
    <div th:replace="~{fragments/app-shell
            :: layout(${page.shell}, ~{::pageContent})}">
        <th:block th:fragment="pageContent">
            <div class="d-grid gap-4">
                            <div th:replace="~{fragments/components/breadcrumb
                                    :: breadcrumb(${page.breadcrumb})}"></div>

                            <section class="d-flex flex-column flex-lg-row align-items-lg-center justify-content-lg-between gap-3">
                                <div>
                                    <h2 class="h3 mb-2" th:text="${page.title}">Select Thumbnail</h2>
                                    <div class="small text-secondary d-flex flex-wrap gap-3">
                                        <span th:each="item : ${page.metadataItems}">
                                            <span th:text="${item.label + ': '}">Label: </span>
                                            <code th:if="${item.monospace}" th:text="${item.value}">value</code>
                                            <span th:unless="${item.monospace}" th:text="${item.value}">value</span>
                                        </span>
                                    </div>
                                </div>

                                <div class="d-flex flex-wrap gap-2">
                                    <a class="btn btn-primary"
                                       th:href="${page.uploadFallbackPath}"
                                       th:attr="hx-get=${page.uploadPartialPath},
                                                hx-target='#app-modal-host',
                                                hx-swap='innerHTML',
                                                hx-disabled-elt='this',
                                                data-app-modal-request='true'">
                                        <span th:text="#{media.thumbnail.upload.trigger}">
                                            Upload Thumbnail Image
                                        </span>
                                    </a>
                                    <a th:href="${page.backPath}"
                                       class="btn btn-outline-secondary"
                                       th:text="#{action.back}">
                                        Back
                                    </a>
                                </div>
                            </section>

                            <div id="media-thumbnail-workspace" class="d-grid gap-4">
                            <section class="card shadow-sm border-0">
                                <div class="card-body p-4">
                                    <form method="get"
                                          th:action="${page.listPath}"
                                          th:attr="hx-get=${page.listPath},
                                                   hx-target='#media-thumbnail-workspace',
                                                   hx-select='#media-thumbnail-workspace',
                                                   hx-swap='outerHTML',
                                                   hx-push-url='true',
                                                   hx-disabled-elt='button[type=submit]'"
                                          class="row g-3 align-items-end">
                                        <input type="hidden" name="page" value="0">

                                        <div class="col-12 col-lg-8">
                                            <label for="thumbnail-original-name" class="form-label">
                                                <span th:text="#{media.thumbnail.imageName}">
                                                    Image Name
                                                </span>
                                            </label>
                                            <input id="thumbnail-original-name"
                                                   name="originalName"
                                                   type="text"
                                                   class="form-control"
                                                   maxlength="255"
                                                   th:placeholder="#{media.thumbnail.searchPlaceholder}"
                                                   th:value="${page.filter.originalName}">
                                        </div>

                                        <div class="col-12 col-lg-4 d-flex justify-content-lg-end gap-2">
                                            <a class="btn btn-outline-secondary"
                                               th:href="${page.listPath}"
                                               th:attr="hx-get=${page.listPath},
                                                        hx-target='#media-thumbnail-workspace',
                                                        hx-select='#media-thumbnail-workspace',
                                                        hx-swap='outerHTML',
                                                        hx-push-url='true',
                                                        hx-disabled-elt='this'">
                                                <span th:text="#{action.clear}">Clear</span>
                                            </a>
                                            <button type="submit" class="btn btn-primary">
                                                <span th:text="#{action.search}">Search</span>
                                            </button>
                                        </div>
                                    </form>
                                </div>
                            </section>

                            <div th:replace="~{fragments/components/assignment-panel :: panel(${page.assignmentPanel})}"></div>
                            </div>
            </div>
        </th:block>
    </div>

</body>
</html>
