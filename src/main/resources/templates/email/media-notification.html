<!doctype html>
<html xmlns:th="http://www.thymeleaf.org">
<body style="margin:0;background:#f4f6f8;font-family:Arial,sans-serif">
<table role="presentation" width="100%" cellspacing="0" cellpadding="0">
    <tr>
        <td align="center" style="padding:32px 16px">
            <table role="presentation"
                   width="600"
                   cellspacing="0"
                   cellpadding="0"
                   style="max-width:600px;background:#fff;border:1px solid #dee2e6">
                <tr>
                    <td style="padding:32px">
                        <h1 style="margin:0 0 16px;font-size:24px"
                            th:text="${email.title}">
                            Media update
                        </h1>
                        <p style="margin:0;color:#495057;line-height:1.6"
                           th:text="${email.content}">
                            Your media status has changed.
                        </p>
                    </td>
                </tr>
                <tr>
                    <td style="padding:16px 32px;background:#f8f9fa;color:#6c757d;font-size:13px">
                        Minimal Spring App
                    </td>
                </tr>
            </table>
        </td>
    </tr>
</table>
</body>
</html>
