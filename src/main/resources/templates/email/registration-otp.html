<!doctype html>
<html xmlns:th="http://www.thymeleaf.org">
<body style="margin:0;background:#f4f6f8;font-family:Arial,sans-serif">
<table role="presentation" width="100%" cellspacing="0" cellpadding="0">
    <tr>
        <td align="center" style="padding:32px 16px">
            <table role="presentation"
                   width="600"
                   cellspacing="0"
                   cellpadding="0"
                   style="max-width:600px;background:#fff;border:1px solid #dee2e6">
                <tr>
                    <td style="padding:32px">
                        <h1 style="margin:0 0 16px;font-size:24px"
                            th:text="${email.heading}">
                            Verify your email
                        </h1>
                        <p style="margin:0 0 24px;color:#495057;line-height:1.6"
                           th:text="${email.instruction}">
                            Enter this code to continue registration.
                        </p>
                        <div style="padding:16px;background:#f8f9fa;
                                    border:1px solid #dee2e6;text-align:center;
                                    font-size:32px;font-weight:700;
                                    letter-spacing:8px"
                             th:text="${email.code}">
                            000000
                        </div>
                        <p style="margin:24px 0 0;color:#6c757d;line-height:1.6"
                           th:text="${email.expiryText}">
                            This code expires in 10 minutes.
                        </p>
                    </td>
                </tr>
            </table>
        </td>
    </tr>
</table>
</body>
</html>
