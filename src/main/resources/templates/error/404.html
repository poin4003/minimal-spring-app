<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      th:lang="${#locale.language}"
      th:with="
          viewStatus=${page != null ? page.status : (status != null ? status : 404)},
          viewTitle=${page != null ? page.title : #messages.msg('error.notFound.title')},
          viewMessage=${page != null ? page.message : (#strings.isEmpty(message) ? #messages.msg('error.notFound.message') : message)},
          viewPath=${page != null ? page.path : path}">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title th:text="${viewStatus + ' ' + viewTitle}">404 Not Found</title>
    <link rel="icon" href="/favicon.ico" type="image/x-icon">
    <script th:src="@{/js/app-ui.js}"></script>
    <link rel="stylesheet" th:href="@{/vendor/bootstrap/css/bootstrap.min.css}">
    <link rel="stylesheet" th:href="@{/css/app-ui.css}">
</head>
<body class="app-error-page">
    <div class="app-error-tools">
        <div th:replace="~{fragments/app-tools :: themeToggle(null)}"></div>
    </div>

    <main class="app-error-layout">
        <div class="container px-0">
            <div class="row justify-content-center">
                <div class="col-lg-6">
                    <div class="app-surface-panel app-error-panel mx-auto">
                        <div>
                            <div class="app-error-code text-warning" th:text="${viewStatus}">404</div>
                            <h1 class="h3 mb-3" th:text="${viewTitle}">Page not found</h1>
                            <p class="text-secondary mb-4" th:text="${viewMessage}">
                                The page or resource you requested does not exist.
                            </p>

                            <div class="d-flex justify-content-center">
                                <button type="button"
                                        class="btn btn-sm btn-outline-secondary"
                                        onclick="window.history.back()"
                                        th:text="#{action.back}">
                                    Back
                                </button>
                            </div>

                            <div class="mt-4 small text-secondary app-error-path">
                                <span th:if="${viewPath != null and !#strings.isEmpty(viewPath)}">
                                    <span th:text="#{common.path}">Path</span>:
                                    <code th:text="${viewPath}">/missing-page</code>
                                </span>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </main>
    <div th:replace="~{fragments/app-tools :: loader}"></div>
</body>
</html>
