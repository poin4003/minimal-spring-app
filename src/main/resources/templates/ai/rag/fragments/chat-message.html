<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<body>
    <article th:fragment="assistantMessage(message)"
             class="ai-chat-message ai-chat-message-assistant border rounded-3 p-3">
        <div class="d-flex align-items-center gap-2 mb-2">
            <span class="text-primary" aria-hidden="true">
                <i class="bi bi-stars"></i>
            </span>
            <span class="small fw-semibold"
                  th:text="#{ai.chat.assistant}">Vibe AI</span>
            <span th:if="${!message.generated}"
                  class="badge text-bg-secondary"
                  th:text="#{ai.chat.mode.search}">Search</span>
            <span th:if="${message.generated}"
                  class="badge text-bg-success"
                  th:text="#{ai.chat.mode.generated}">Generated</span>
        </div>

        <p class="ai-chat-answer mb-0" th:text="${message.answer}"></p>

        <section th:if="${!#lists.isEmpty(message.sources)}"
                 class="mt-3">
            <div class="d-flex justify-content-between align-items-center
                        mb-2 small fw-semibold text-body-secondary">
                <span th:text="#{ai.chat.sources.title}">Sources</span>
                <span class="badge text-bg-secondary"
                      th:text="${#lists.size(message.sources)}">3</span>
            </div>
            <div class="list-group">
                <a th:each="source : ${message.sources}"
                   class="list-group-item list-group-item-action
                          d-flex align-items-start gap-3"
                   th:classappend="${source.detailPath == null}
                           ? ' disabled'"
                   th:href="${source.detailPath}">
                    <span class="badge rounded-pill text-bg-primary mt-1"
                          th:text="${source.rank}">1</span>
                    <span class="min-w-0 flex-grow-1">
                        <span class="d-flex gap-2 small text-body-secondary mb-1">
                            <span th:text="${source.postTypeLabel}">Post</span>
                            <span aria-hidden="true">/</span>
                            <span th:text="#{ai.chat.sources.relevance(
                                    ${source.relevancePercent})}">80% relevant</span>
                        </span>
                        <span class="ai-chat-source-content small"
                              th:text="${source.content}">Post content</span>
                    </span>
                    <i th:if="${source.detailPath != null}"
                       class="bi bi-arrow-up-right text-body-secondary"
                       aria-hidden="true"></i>
                </a>
            </div>
        </section>

    </article>

    <article th:fragment="assistantStreamMessage"
             class="ai-chat-message ai-chat-message-assistant border rounded-3 p-3"
             data-ai-chat-assistant-message>
        <div class="d-flex align-items-center gap-2 mb-2">
            <span class="text-primary" aria-hidden="true">
                <i class="bi bi-stars"></i>
            </span>
            <span class="small fw-semibold"
                  th:text="#{ai.chat.assistant}">Vibe AI</span>
            <span class="badge text-bg-success"
                  data-ai-chat-mode
                  th:data-generated-label="#{ai.chat.mode.generated}"
                  th:data-search-label="#{ai.chat.mode.search}"
                  th:text="#{ai.chat.mode.generated}">Generated</span>
            <span class="badge text-bg-warning"
                  data-ai-chat-status
                  th:data-interrupted-label="#{ai.chat.status.interrupted}"
                  th:text="#{ai.chat.status.interrupted}"
                  hidden>Interrupted</span>
        </div>

        <p class="ai-chat-answer mb-0"
           data-ai-chat-answer
           hidden></p>

        <section class="mt-3"
                 data-ai-chat-sources
                 hidden>
            <div class="d-flex justify-content-between align-items-center
                        mb-2 small fw-semibold text-body-secondary">
                <span th:text="#{ai.chat.sources.title}">Sources</span>
                <span class="badge text-bg-secondary"
                      data-ai-chat-source-count>0</span>
            </div>
            <div class="list-group"
                 data-ai-chat-source-list></div>
        </section>

    </article>

    <a th:fragment="streamSource"
       class="list-group-item list-group-item-action
              d-flex align-items-start gap-3"
       data-ai-chat-source>
        <span class="badge rounded-pill text-bg-primary mt-1"
              data-ai-chat-source-rank></span>
        <span class="min-w-0 flex-grow-1">
            <span class="d-flex gap-2 small text-body-secondary mb-1">
                <span data-ai-chat-source-type></span>
                <span aria-hidden="true">/</span>
                <span data-ai-chat-source-relevance></span>
            </span>
            <span class="ai-chat-source-content small"
                  data-ai-chat-source-content></span>
        </span>
        <i class="bi bi-arrow-up-right text-body-secondary"
           data-ai-chat-source-link-icon
           aria-hidden="true"></i>
    </a>
</body>
</html>
