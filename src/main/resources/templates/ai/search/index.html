<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      th:lang="${#locale.language}">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title th:text="${page.title}">Search</title>
    <link rel="icon" href="/favicon.ico" type="image/x-icon">
    <script th:src="@{/js/app-ui.js}"></script>
    <link rel="stylesheet" th:href="@{/vendor/bootstrap/css/bootstrap.min.css}">
    <link rel="stylesheet"
          th:href="@{/vendor/bootstrap-icons/font/bootstrap-icons.min.css}">
    <link rel="stylesheet" th:href="@{/css/app-ui.css}">
    <link rel="stylesheet" th:href="@{/css/social-shell.css}">
    <th:block th:replace="~{fragments/app-tools :: frontendScripts}"></th:block>
</head>
<body class="bg-body-tertiary">
    <div th:replace="~{fragments/social-shell
            :: layout(${page.shell}, ~{::pageContent})}">
        <th:block th:fragment="pageContent">
            <main x-data="searchForm"
                  th:data-initial-query="${page.query}">
                <div class="row justify-content-center">
                    <div class="col-12 col-xxl-10">
                        <form class="post-search-form mb-4"
                              method="get"
                              th:action="${page.searchPath}"
                              th:hx-post="${page.resultsPath}"
                              hx-target="#post-search-results"
                              hx-swap="innerHTML"
                              hx-indicator="#post-search-loading"
                              hx-disabled-elt="find button"
                              hx-params="query"
                              hx-push-url="false"
                              hx-replace-url="false"
                              x-ref="form"
                              x-on:submit="submit($event)">
                            <label class="visually-hidden"
                                   for="post-search-query"
                                   th:text="#{ai.search.query.label}">
                                Search query
                            </label>
                            <div class="input-group input-group-lg">
                                <span class="input-group-text bg-body">
                                    <i class="bi bi-search"
                                       aria-hidden="true"></i>
                                </span>
                                <input id="post-search-query"
                                       class="form-control"
                                       type="search"
                                       name="q"
                                       maxlength="2000"
                                       required
                                       autocomplete="off"
                                       x-ref="query"
                                       x-model="query"
                                       th:placeholder="#{ai.search.query.placeholder}">
                                <input type="hidden"
                                       name="query"
                                       x-bind:value="query">
                                <button class="btn btn-primary px-3 px-md-4"
                                        type="submit"
                                        th:attr="aria-label=#{ai.search.submit}">
                                    <i class="bi bi-arrow-right"
                                       aria-hidden="true"></i>
                                </button>
                            </div>
                        </form>

                        <div id="post-search-loading"
                             class="htmx-indicator d-flex align-items-center gap-2
                                    text-body-secondary py-3">
                            <span class="spinner-border spinner-border-sm"
                                  aria-hidden="true"></span>
                            <span th:text="#{ai.search.loading}">
                                Finding related posts...
                            </span>
                        </div>

                        <section id="post-search-results"
                                 aria-live="polite"></section>
                    </div>
                </div>
            </main>
        </th:block>
    </div>
</body>
</html>
