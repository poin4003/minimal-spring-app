<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      th:lang="${#locale.language}">
<body>
    <header th:fragment="header(shell)"
            id="app-social-header"
            class="social-header sticky-top border-bottom"
            hx-preserve="true"
            th:attr="hx-ext=${shell.notificationWidget != null ? 'sse' : null},
                     sse-connect=${shell.notificationWidget != null
                             ? shell.notificationWidget.streamPath
                             : null}">
        <nav class="navbar p-0">
            <div class="container-fluid social-container flex-nowrap gap-2 px-3 px-lg-4">
                <a class="navbar-brand d-flex align-items-center gap-2 fw-semibold mb-0"
                   th:href="${shell.socialPath}"
                   hx-push-url="true"
                   hx-replace-url="false">
                    <img th:src="@{/favicon.ico}"
                         class="social-brand-logo flex-shrink-0"
                         width="32"
                         height="32"
                         alt="">
                    <span th:text="${shell.socialTitle}">Motumo</span>
                </a>

                <div class="social-header-actions d-flex align-items-center gap-2 ms-auto">
                    <th:block th:if="${shell.notificationWidget != null}">
                        <div th:replace="~{notification/fragments/inbox
                                :: trigger(${shell.notificationWidget})}"></div>
                    </th:block>

                    <a th:if="${shell.adminPath != null}"
                       th:href="${shell.adminPath}"
                       hx-boost="false"
                       class="btn btn-outline-secondary app-header-action app-icon-button social-header-admin-action"
                       th:attr="aria-label=#{social.openAdmin},
                                title=#{social.openAdmin}">
                        <i class="bi bi-shield-lock" aria-hidden="true"></i>
                    </a>

                    <a th:if="${shell.currentUser != null}"
                       th:href="${shell.myPostsPath}"
                       hx-push-url="true"
                       hx-replace-url="false"
                       class="btn btn-outline-secondary app-header-action app-icon-button social-header-personal-action"
                       th:attr="aria-label=#{profile.personal.title},
                                title=#{profile.personal.title}">
                        <i class="bi bi-person-circle" aria-hidden="true"></i>
                    </a>

                    <a th:if="${shell.currentUser != null}"
                       th:href="${shell.profilePath}"
                       hx-push-url="true"
                       hx-replace-url="false"
                       class="btn btn-outline-secondary app-header-action app-icon-button social-header-profile-action"
                       th:attr="aria-label=#{profile.title},
                                title=#{profile.title}">
                        <i class="bi bi-gear" aria-hidden="true"></i>
                    </a>

                    <div th:replace="~{fragments/app-tools
                            :: themeToggle(${shell.themeUpdatePath})}"></div>

                    <form th:if="${shell.currentUser != null}"
                          method="post"
                          th:action="${shell.logoutPath}"
                          hx-boost="false"
                          class="mb-0 social-header-signout-action">
                        <input type="hidden"
                               th:name="${_csrf.parameterName}"
                               th:value="${_csrf.token}">
                        <button type="submit"
                                class="btn btn-outline-secondary app-header-action app-icon-button"
                                th:attr="aria-label=#{action.signOut},
                                         title=#{action.signOut}">
                            <i class="bi bi-box-arrow-right" aria-hidden="true"></i>
                        </button>
                    </form>

                    <div th:unless="${shell.currentUser != null}"
                         class="d-flex align-items-center">
                        <a class="btn btn-outline-primary"
                           th:href="${shell.loginPath}"
                           hx-boost="false"
                           th:text="#{auth.login.title}">
                            Sign in
                        </a>
                    </div>
                </div>
            </div>
        </nav>
    </header>
</body>
</html>
