<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      th:lang="${#locale.language}">
<body>
    <nav th:fragment="navigation(items)"
         class="nav flex-nowrap flex-lg-column overflow-x-auto social-navigation"
         th:attr="aria-label=#{shell.mainNavigation}">
        <a th:each="item : ${items}"
           th:href="${item.path}"
           class="nav-link d-flex align-items-center gap-2 text-nowrap"
           x-data="navigationItem"
           x-bind:class="{ 'active': active }"
           x-bind:aria-current="active ? 'page' : null"
           hx-push-url="true"
           hx-replace-url="false"
           th:classappend="${item.active} ? ' active' : ''"
           th:attr="aria-current=${item.active ? 'page' : null},
                    aria-label=${item.label},
                    title=${item.label},
                    data-app-menu-path=${item.path}">
            <i class="bi"
               th:classappend="${' bi-' + item.icon}"
               aria-hidden="true"></i>
            <span class="social-navigation-label"
                  th:text="${item.label}">Feed</span>
        </a>
    </nav>
</body>
</html>
