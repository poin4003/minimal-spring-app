<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<body>
<div th:fragment="alert(alert)"
     class="alert app-error-alert d-flex align-items-start gap-3 mb-0"
     role="alert"
     data-ui-error-alert>
    <i class="bi bi-exclamation-circle flex-shrink-0" aria-hidden="true"></i>
    <div class="min-w-0">
        <div class="fw-semibold" th:text="${alert.error}">UPLOAD_ERROR</div>
        <div class="small mt-1" th:text="${alert.message}">
            The request could not be completed.
        </div>
    </div>
</div>
</body>
</html>
