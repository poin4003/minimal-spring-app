<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      th:lang="${#locale.language}">
<body>
<nav th:fragment="breadcrumb(breadcrumb)"
     class="app-breadcrumb"
     th:attr="aria-label=#{breadcrumb.label}">
    <ol class="breadcrumb mb-0">
        <li th:each="item : ${breadcrumb.items}"
            class="breadcrumb-item"
            th:classappend="${item.active ? ' active' : ''}"
            th:attr="aria-current=${item.active ? 'page' : null}">
            <span th:if="${item.active}" th:text="${item.label}">Current</span>
            <a th:unless="${item.active}"
               th:href="${item.path}"
               hx-replace-url="false"
               th:text="${item.label}">
                Parent
            </a>
        </li>
    </ol>
</nav>
</body>
</html>
