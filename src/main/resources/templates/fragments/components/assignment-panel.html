<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<body>
<section th:fragment="panel(panel)"
         th:id="${panel.id}"
         class="card app-surface-panel app-component">
    <div class="card-body p-0">
        <div class="app-section-header">
            <h2 class="app-section-title" th:text="${panel.title}">Assignment</h2>
            <p class="app-section-description" th:text="${panel.description}">Description</p>
        </div>

        <div th:if="${!#lists.isEmpty(panel.rows)}" class="list-group list-group-flush">
            <div th:each="row : ${panel.rows}"
                 class="list-group-item d-flex flex-column flex-sm-row justify-content-between align-items-stretch align-items-sm-start gap-3">
                <div class="d-flex align-items-center gap-3 overflow-hidden">
                    <img th:if="${row.imageUrl != null}"
                         class="rounded border object-fit-cover flex-shrink-0"
                         th:src="${row.imageUrl}"
                         th:alt="${row.title}"
                         data-media-thumbnail
                         width="72"
                         height="72"
                         loading="lazy"
                         decoding="async">

                    <div class="overflow-hidden">
                        <div class="fw-semibold text-truncate"
                             th:title="${row.title}"
                             th:text="${row.title}">
                            TITLE
                        </div>
                        <div class="small text-secondary"
                             th:text="${row.description}">
                            Description
                        </div>
                    </div>
                </div>

                <form method="post"
                      th:action="${row.action.path}"
                      class="mb-0 app-assignment-action"
                      th:attr="hx-post=${row.action.path},
                               hx-target='this',
                               hx-select='unset',
                               hx-swap='none',
                               hx-push-url='false',
                               hx-replace-url='false',
                               hx-disabled-elt='button[type=submit]'">
                    <input type="hidden"
                           th:name="${_csrf.parameterName}"
                           th:value="${_csrf.token}">
                    <input type="hidden" name="targetId" th:value="${row.action.targetId}">
                    <th:block th:if="${row.action.query != null}">
                        <input type="hidden" name="mode" th:value="${row.action.query.mode.name()}">
                        <input type="hidden" name="page" th:value="${row.action.query.page}">
                        <input type="hidden" name="size" th:value="${row.action.query.size}">
                        <input type="hidden" name="sortBy" th:value="${row.action.query.sortBy}">
                        <input type="hidden" name="sortDirection" th:value="${row.action.query.sortDirection.name()}">
                    </th:block>
                    <button type="submit"
                            class="btn btn-sm"
                            th:classappend="${' ' + row.action.buttonClass}"
                            th:text="${row.action.label}">
                        Action
                    </button>
                </form>
            </div>
        </div>

        <div th:if="${#lists.isEmpty(panel.rows)}"
             class="app-empty-state"
             th:text="${panel.emptyMessage}">
            No items.
        </div>

        <div th:if="${panel.pagination != null and panel.pagination.totalPages > 1}"
             class="app-component-footer">
            <div th:replace="~{fragments/components/pagination :: pagination(${panel.pagination})}"></div>
        </div>
    </div>
</section>
</body>
</html>
