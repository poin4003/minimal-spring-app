<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      th:lang="${#locale.language}">
<body>
<nav th:fragment="pagination(pagination)"
     th:if="${pagination != null and pagination.totalPages > 1}"
     th:attr="aria-label=#{pagination.label}">
    <ul class="pagination pagination-sm mb-0 app-pagination">
        <li class="page-item" th:classappend="${!pagination.hasPrevious} ? ' disabled' : ''">
            <a class="page-link"
               th:href="${pagination.hasPrevious ? pagination.previousPath : '#'}"
               th:attr="aria-label=#{action.previous},
                        hx-get=${pagination.htmxNavigation != null and pagination.hasPrevious ? pagination.previousPath : null},
                        hx-target=${pagination.htmxNavigation != null ? pagination.htmxNavigation.target : null},
                        hx-select=${pagination.htmxNavigation != null ? pagination.htmxNavigation.select : null},
                        hx-swap=${pagination.htmxNavigation != null ? pagination.htmxNavigation.swap : null},
                        hx-push-url=${pagination.htmxNavigation != null ? pagination.htmxNavigation.pushUrl : null},
                        hx-replace-url=${pagination.htmxNavigation != null ? pagination.htmxNavigation.replaceUrl : null},
                        hx-disabled-elt=${pagination.htmxNavigation != null ? 'this' : null},
                        aria-disabled=${!pagination.hasPrevious},
                        tabindex=${!pagination.hasPrevious ? '-1' : null}">
                <i class="bi bi-chevron-left d-sm-none" aria-hidden="true"></i>
                <span class="d-none d-sm-inline" th:text="#{action.previous}">Previous</span>
            </a>
        </li>

        <li class="page-item"
            th:each="item : ${pagination.items}"
            th:classappend="${item.active} ? ' active' : (${item.disabled} ? ' disabled' : '')">
            <span th:if="${item.disabled}" class="page-link" th:text="${item.label}">...</span>
            <a th:unless="${item.disabled}"
               class="page-link"
               th:href="${item.path}"
               th:text="${item.label}"
               th:attr="hx-get=${pagination.htmxNavigation != null ? item.path : null},
                        hx-target=${pagination.htmxNavigation != null ? pagination.htmxNavigation.target : null},
                        hx-select=${pagination.htmxNavigation != null ? pagination.htmxNavigation.select : null},
                        hx-swap=${pagination.htmxNavigation != null ? pagination.htmxNavigation.swap : null},
                        hx-push-url=${pagination.htmxNavigation != null ? pagination.htmxNavigation.pushUrl : null},
                        hx-replace-url=${pagination.htmxNavigation != null ? pagination.htmxNavigation.replaceUrl : null},
                        hx-disabled-elt=${pagination.htmxNavigation != null ? 'this' : null},
                        aria-current=${item.active ? 'page' : null}">
                1
            </a>
        </li>

        <li class="page-item" th:classappend="${!pagination.hasNext} ? ' disabled' : ''">
            <a class="page-link"
               th:href="${pagination.hasNext ? pagination.nextPath : '#'}"
               th:attr="aria-label=#{action.next},
                        hx-get=${pagination.htmxNavigation != null and pagination.hasNext ? pagination.nextPath : null},
                        hx-target=${pagination.htmxNavigation != null ? pagination.htmxNavigation.target : null},
                        hx-select=${pagination.htmxNavigation != null ? pagination.htmxNavigation.select : null},
                        hx-swap=${pagination.htmxNavigation != null ? pagination.htmxNavigation.swap : null},
                        hx-push-url=${pagination.htmxNavigation != null ? pagination.htmxNavigation.pushUrl : null},
                        hx-replace-url=${pagination.htmxNavigation != null ? pagination.htmxNavigation.replaceUrl : null},
                        hx-disabled-elt=${pagination.htmxNavigation != null ? 'this' : null},
                        aria-disabled=${!pagination.hasNext},
                        tabindex=${!pagination.hasNext ? '-1' : null}">
                <span class="d-none d-sm-inline" th:text="#{action.next}">Next</span>
                <i class="bi bi-chevron-right d-sm-none" aria-hidden="true"></i>
            </a>
        </li>
    </ul>
</nav>
</body>
</html>
