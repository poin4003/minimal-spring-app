<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      th:lang="${#locale.language}">
<body>
    <div th:fragment="layout(shell, content)"
         class="app-shell-layout"
         hx-ext="sse"
         th:attr="sse-connect=${shell.notificationWidget.streamPath}">
        <div th:replace="~{fragments/app-header :: header(${shell})}"></div>

        <aside id="app-sidebar"
               class="offcanvas-lg offcanvas-start app-sidebar-panel border-end"
               tabindex="-1"
               aria-labelledby="app-sidebar-title">
            <div class="offcanvas-header border-bottom d-lg-none">
                <h2 id="app-sidebar-title"
                    class="h5 mb-0"
                    th:text="${shell.title}">
                    Vibe
                </h2>
                <button type="button"
                        class="btn-close"
                        data-bs-dismiss="offcanvas"
                        data-bs-target="#app-sidebar"
                        th:attr="aria-label=#{shell.closeMenu}"></button>
            </div>

            <div class="offcanvas-body d-flex flex-column p-0">
                <nav class="app-sidebar-navigation overflow-y-auto px-3 py-3"
                     th:attr="aria-label=#{shell.mainNavigation}">
                    <div th:replace="~{fragments/menu
                            :: tree(${shell.menuTree})}"></div>
                </nav>
            </div>
        </aside>

        <section class="app-content-panel">
            <main id="app-page-content" class="app-page-main px-0 py-3 p-sm-4 p-xl-5">
                <th:block th:replace="${content}"></th:block>
            </main>
        </section>

        <div th:replace="~{fragments/app-tools :: modalHost}"></div>
        <div th:replace="~{fragments/app-tools :: loader}"></div>
        <div th:replace="~{fragments/app-tools :: htmxError}"></div>
    </div>
</body>
</html>
