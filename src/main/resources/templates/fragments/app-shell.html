<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      th:lang="${#locale.language}">
<body>
    <th:block th:fragment="layout(shell, content)">
        <div th:unless="${htmxRequest == true}"
             class="app-shell-layout"
             hx-boost="true"
             hx-target="#app-page-content"
             hx-select="#app-page-content"
             hx-select-oob="#app-sidebar-navigation"
             hx-swap="outerHTML show:top"
             hx-push-url="false"
             hx-replace-url="false"
             hx-ext="sse, head-support"
             th:attr="sse-connect=${shell.notificationWidget.streamPath}">
            <div th:replace="~{fragments/app-header :: header(${shell})}"></div>

            <aside id="app-sidebar"
                   class="offcanvas-lg offcanvas-start app-sidebar-panel border-end"
                   tabindex="-1"
                   aria-labelledby="app-sidebar-title">
                <div class="offcanvas-header border-bottom d-lg-none">
                    <h2 id="app-sidebar-title"
                        class="h5 mb-0"
                        th:text="${shell.title}">
                        Vibe
                    </h2>
                    <button type="button"
                            class="btn-close"
                            data-bs-dismiss="offcanvas"
                            data-bs-target="#app-sidebar"
                            th:attr="aria-label=#{shell.closeMenu}"></button>
                </div>

                <div class="offcanvas-body d-flex flex-column p-0">
                    <th:block th:replace="~{fragments/app-shell
                            :: navigation(${shell})}"></th:block>
                </div>
            </aside>

            <section class="app-content-panel">
                <th:block th:replace="~{fragments/app-shell
                        :: pageContent(${content})}"></th:block>
            </section>

            <div th:replace="~{fragments/app-tools :: modalHost}"></div>
            <div th:replace="~{fragments/app-tools :: loader}"></div>
            <div th:replace="~{fragments/app-tools :: htmxError}"></div>
        </div>

        <th:block th:if="${htmxRequest == true}">
            <th:block th:replace="~{fragments/app-shell
                    :: pageContent(${content})}"></th:block>
            <th:block th:replace="~{fragments/app-shell
                    :: navigation(${shell})}"></th:block>
        </th:block>
    </th:block>

    <nav th:fragment="navigation(shell)"
         id="app-sidebar-navigation"
         class="app-sidebar-navigation overflow-y-auto px-3 py-3"
         th:attr="aria-label=#{shell.mainNavigation}">
        <div th:replace="~{fragments/menu
                :: tree(${shell.menuTree})}"></div>
    </nav>

    <main th:fragment="pageContent(content)"
          id="app-page-content"
          class="app-page-main px-0 py-3 p-sm-4 p-xl-5"
          hx-history-elt>
        <th:block th:replace="${content}"></th:block>
    </main>
</body>
</html>
