<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      th:lang="${#locale.language}">
<body>
<ul class="app-menu list-unstyled mb-0" th:fragment="tree(items)">
    <li th:each="item : ${items}" class="app-menu-item">
        <a th:if="${#lists.isEmpty(item.children)}"
           th:href="${item.disabled or item.path == null ? '#' : item.path}"
           class="app-menu-link d-flex align-items-center gap-2 text-decoration-none"
           th:classappend="${item.active} ? ' active' : ''"
           data-app-menu-tooltip
           th:attr="aria-disabled=${item.disabled},
                    aria-label=${item.label},
                    data-bs-title=${item.label}">
            <i th:if="${item.icon != null}"
               class="app-menu-icon bi"
               th:classappend="${' bi-' + item.icon}"
               aria-hidden="true"></i>
            <span class="app-menu-label" th:text="${item.label}">Dashboard</span>
        </a>

        <div th:unless="${#lists.isEmpty(item.children)}">
            <div class="app-menu-group d-flex align-items-center gap-2"
                 th:classappend="${item.open} ? ' active' : ''"
                 data-app-menu-tooltip
                 th:attr="aria-label=${item.label},
                          data-bs-title=${item.label}">
                <i th:if="${item.icon != null}"
                   class="app-menu-icon bi"
                   th:classappend="${' bi-' + item.icon}"
                   aria-hidden="true"></i>
                <span class="app-menu-label" th:text="${item.label}">
                    User Management
                </span>
            </div>

            <div class="app-menu-children">
                <div th:replace="~{fragments/menu :: tree(${item.children})}"></div>
            </div>
        </div>
    </li>
</ul>
</body>
</html>
