<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      th:lang="${#locale.language}">
<body>
    <header th:fragment="header(shell)"
            class="app-header d-flex align-items-center justify-content-between gap-3 px-3 px-md-4 border-bottom">
        <div class="d-flex align-items-center gap-3 min-w-0">
            <button type="button"
                    class="btn btn-outline-secondary app-header-action app-icon-button d-lg-none"
                    data-bs-toggle="offcanvas"
                    data-bs-target="#app-sidebar"
                    aria-controls="app-sidebar"
                    th:attr="aria-label=#{shell.openMenu}">
                <i class="bi bi-list" aria-hidden="true"></i>
            </button>

            <button type="button"
                    class="btn btn-outline-secondary app-header-action app-icon-button d-none d-lg-inline-grid"
                    x-data
                    x-on:click="$store.sidebar.toggle()"
                    x-bind:aria-expanded="(!$store.sidebar.collapsed).toString()"
                    x-bind:aria-label="$store.sidebar.collapsed
                            ? $el.dataset.expandLabel
                            : $el.dataset.collapseLabel"
                    th:attr="aria-label=#{shell.collapseMenu},
                             data-expand-label=#{shell.expandMenu},
                             data-collapse-label=#{shell.collapseMenu}">
                <i class="bi"
                   x-bind:class="$store.sidebar.collapsed
                           ? 'bi-layout-sidebar'
                           : 'bi-layout-sidebar-inset'"
                   aria-hidden="true"></i>
            </button>

            <div class="app-header-brand d-flex align-items-center gap-2 min-w-0">
                <img th:src="@{/favicon.ico}"
                     class="app-header-brand-mark"
                     width="28"
                     height="28"
                     alt="">
                <span class="fw-semibold text-truncate"
                      th:text="${shell.title}">
                    Vibe
                </span>
            </div>
        </div>

        <div class="d-flex align-items-center gap-2 ms-auto">
            <div th:if="${shell.currentUser != null}"
                 class="app-header-user d-none d-xl-block text-end min-w-0 me-2">
                <div class="small text-secondary"
                     th:text="#{shell.signedInAs}">
                    Signed in as
                </div>
                <div class="small fw-semibold text-truncate"
                     th:text="${shell.currentUser.email}"></div>
            </div>

            <div th:replace="~{notification/fragments/inbox :: trigger(${shell.notificationWidget})}"></div>
            <a th:href="${shell.profilePath}"
               class="btn btn-outline-secondary app-header-action app-icon-button"
               hx-boost="false"
               th:attr="aria-label=#{profile.title},
                        title=#{profile.title}">
                <i class="bi bi-person-circle" aria-hidden="true"></i>
                <span class="visually-hidden"
                      th:text="#{profile.title}">
                    Profile settings
                </span>
            </a>
            <div th:replace="~{fragments/app-tools
                    :: themeToggle(${shell.themeUpdatePath})}"></div>

            <form method="post"
                  th:attr="action=${shell.logoutPath}"
                  hx-boost="false"
                  class="mb-0">
                <input type="hidden"
                       th:name="${_csrf.parameterName}"
                       th:value="${_csrf.token}">
                <button type="submit"
                        class="btn btn-outline-secondary app-header-action app-icon-button"
                        th:attr="aria-label=#{action.signOut},
                                 title=#{action.signOut}">
                    <i class="bi bi-box-arrow-right" aria-hidden="true"></i>
                    <span class="visually-hidden"
                          th:text="#{action.signOut}">
                        Sign out
                    </span>
                </button>
            </form>
        </div>
    </header>
</body>
</html>
