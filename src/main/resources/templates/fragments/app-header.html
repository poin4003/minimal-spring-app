<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<body>
    <header th:fragment="header(shell)"
            class="app-header d-flex flex-column flex-md-row align-items-md-center justify-content-md-between gap-3 px-4 py-3 border-bottom">
        <div th:if="${shell.currentUser != null}">
            <p class="text-secondary small mb-1">Signed in as</p>
            <div class="fw-semibold text-break"
                 th:text="${shell.currentUser.email}"></div>
        </div>

        <div class="d-flex align-items-center gap-2 ms-md-auto">
            <div th:replace="~{notification/fragments/inbox :: trigger(${shell.notificationWidget})}"></div>
            <div th:replace="~{fragments/app-tools :: themeToggle}"></div>

            <form method="post" th:attr="action=${shell.logoutPath}" class="mb-0">
                <input type="hidden"
                       th:name="${_csrf.parameterName}"
                       th:value="${_csrf.token}">
                <button type="submit"
                        class="btn btn-outline-secondary app-header-action app-icon-button"
                        aria-label="Sign out"
                        title="Sign out">
                    <i class="bi bi-box-arrow-right" aria-hidden="true"></i>
                    <span class="visually-hidden">Sign out</span>
                </button>
            </form>
        </div>
    </header>
</body>
</html>
