<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" th:lang="${#locale.language}">
<body>
<section th:fragment="items(page)" id="owner-video-series-items" class="d-grid gap-3">
    <div class="d-flex justify-content-end">
        <div th:replace="~{post/video/fragments/series-sort
                :: toggle(${page.itemSort}, 'owner-video-series-items')}"></div>
    </div>
    <div th:if="${#lists.isEmpty(page.items)}"
         class="app-empty-state app-surface-panel"
         th:text="#{video.series.items.empty}">No videos.</div>
    <article th:each="item : ${page.items}"
             class="card app-surface-panel overflow-hidden">
        <div class="row g-0 align-items-center">
            <div class="col-5 col-md-4 col-xl-3">
                <div class="ratio ratio-16x9 bg-black"
                     data-media-gallery-card>
                    <img th:if="${item.video.content.media.thumbnailUrl != null}"
                         th:src="${item.video.content.media.thumbnailUrl}"
                         th:alt="${item.video.title}"
                         class="w-100 h-100 object-fit-cover" loading="lazy">
                    <span th:unless="${item.video.content.media.thumbnailUrl != null}"
                          class="d-flex align-items-center justify-content-center text-white-50">
                        <i class="bi bi-play-circle" aria-hidden="true"></i>
                    </span>
                    <span class="app-media-hover-preview d-none"
                          th:attr="data-media-hover-preview=${item.video.content.media.contentUrl}"
                          aria-hidden="true"></span>
                    <span class="video-card-play d-flex align-items-center justify-content-center">
                        <i class="bi bi-play-fill" aria-hidden="true"></i>
                    </span>
                </div>
            </div>
            <div class="col-7 col-md-8 col-xl-9">
                <div class="card-body d-flex align-items-center gap-3 py-2 py-md-3">
                    <span class="badge text-bg-secondary" th:text="${item.position + 1}">1</span>
                    <h3 class="h6 text-truncate flex-grow-1 mb-0" th:text="${item.video.title}">Video</h3>
                    <div class="d-flex gap-1 flex-shrink-0">
                        <form method="post"
                              th:action="${page.itemActionPathPrefix + item.id + '/move'}"
                              th:attr="hx-post=${page.itemActionPathPrefix + item.id + '/move'},
                                       hx-target='#owner-video-series-items',
                                       hx-select='#owner-video-series-items',
                                       hx-swap='outerHTML',
                                       hx-disabled-elt='button'">
                            <input type="hidden" th:if="${_csrf != null}"
                                   th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
                            <input type="hidden" name="targetPosition"
                                   th:value="${page.itemSort.ascending
                                           ? item.position - 1
                                           : item.position + 1}">
                            <input type="hidden" name="page"
                                   th:value="${page.pagination.currentPage}">
                            <input type="hidden" name="size"
                                   th:value="${page.pagination.pageSize}">
                            <input type="hidden" name="sortDirection"
                                   th:value="${page.itemSort.ascending ? 'ASC' : 'DESC'}">
                            <button type="submit" class="btn btn-sm btn-outline-secondary"
                                    th:disabled="${page.itemSort.ascending
                                            ? item.position == 0
                                            : item.position + 1 >= page.card.series.videoCount}"
                                    th:title="#{video.series.items.moveUp}">
                                <i class="bi bi-arrow-up" aria-hidden="true"></i>
                                <span class="visually-hidden"
                                      th:text="#{video.series.items.moveUp}">Move up</span>
                            </button>
                        </form>
                        <form method="post"
                              th:action="${page.itemActionPathPrefix + item.id + '/move'}"
                              th:attr="hx-post=${page.itemActionPathPrefix + item.id + '/move'},
                                       hx-target='#owner-video-series-items',
                                       hx-select='#owner-video-series-items',
                                       hx-swap='outerHTML',
                                       hx-disabled-elt='button'">
                            <input type="hidden" th:if="${_csrf != null}"
                                   th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
                            <input type="hidden" name="targetPosition"
                                   th:value="${page.itemSort.ascending
                                           ? item.position + 1
                                           : item.position - 1}">
                            <input type="hidden" name="page"
                                   th:value="${page.pagination.currentPage}">
                            <input type="hidden" name="size"
                                   th:value="${page.pagination.pageSize}">
                            <input type="hidden" name="sortDirection"
                                   th:value="${page.itemSort.ascending ? 'ASC' : 'DESC'}">
                            <button type="submit" class="btn btn-sm btn-outline-secondary"
                                    th:disabled="${page.itemSort.ascending
                                            ? item.position + 1 >= page.card.series.videoCount
                                            : item.position == 0}"
                                    th:title="#{video.series.items.moveDown}">
                                <i class="bi bi-arrow-down" aria-hidden="true"></i>
                                <span class="visually-hidden"
                                      th:text="#{video.series.items.moveDown}">Move down</span>
                            </button>
                        </form>
                        <form method="post"
                              th:action="${page.itemActionPathPrefix + item.id + '/remove'}"
                              th:attr="hx-post=${page.itemActionPathPrefix + item.id + '/remove'},
                                       hx-target='#owner-video-series-items',
                                       hx-select='#owner-video-series-items',
                                       hx-swap='outerHTML',
                                       hx-confirm=#{video.series.items.removeConfirm},
                                       hx-disabled-elt='button'">
                            <input type="hidden" th:if="${_csrf != null}"
                                   th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
                            <input type="hidden" name="page"
                                   th:value="${page.pagination.currentPage}">
                            <input type="hidden" name="size"
                                   th:value="${page.pagination.pageSize}">
                            <input type="hidden" name="sortDirection"
                                   th:value="${page.itemSort.ascending ? 'ASC' : 'DESC'}">
                            <button type="submit" class="btn btn-sm btn-outline-danger"
                                    th:title="#{action.remove}">
                                <i class="bi bi-x-lg" aria-hidden="true"></i>
                                <span class="visually-hidden" th:text="#{action.remove}">Remove</span>
                            </button>
                        </form>
                    </div>
                </div>
            </div>
        </div>
    </article>
    <div class="d-flex justify-content-center">
        <div th:replace="~{fragments/components/pagination :: pagination(${page.pagination})}"></div>
    </div>
</section>
</body>
</html>
