<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" th:lang="${#locale.language}">
<head>
    <title th:text="${page.title}">My videos</title>
    <th:block th:replace="~{fragments/app-tools :: socialHead}"></th:block>
</head>
<body class="bg-body-tertiary">
<div th:replace="~{fragments/social-shell :: layout(${page.shell}, 'bg-body-tertiary', ~{::pageContent})}">
    <th:block th:fragment="pageContent">
        <div class="video-owner-page mx-auto d-grid gap-4">
            <header class="d-flex flex-wrap align-items-center justify-content-between gap-3 border-bottom pb-3">
                <nav class="nav nav-underline gap-4" th:aria-label="#{video.public.tabs}">
                    <a class="nav-link"
                       th:classappend="${page.activeTab.name() == 'VIDEOS'} ? ' active' : ''"
                       th:href="${page.videosPath}"
                       hx-push-url="false"
                       hx-replace-url="true"
                       th:text="#{video.public.tab.videos}">Videos</a>
                    <a class="nav-link"
                       th:classappend="${page.activeTab.name() == 'SERIES'} ? ' active' : ''"
                       th:href="${page.seriesPath}"
                       hx-push-url="false"
                       hx-replace-url="true"
                       th:text="#{video.public.tab.series}">Series</a>
                </nav>
                <div class="d-flex gap-2">
                    <a th:if="${page.activeTab.name() == 'VIDEOS'}"
                       th:href="${page.createVideoPath}"
                       class="btn btn-sm btn-primary"
                       data-app-page-navigation
                       hx-boost="true"
                       hx-target="#app-social-page-content"
                       hx-select="#app-social-page-content"
                       hx-swap="outerHTML show:top"
                       hx-push-url="true"
                       hx-replace-url="false">
                        <i class="bi bi-plus-lg me-1" aria-hidden="true"></i>
                        <span th:text="#{video.owner.create}">Create video</span>
                    </a>
                    <a th:if="${page.activeTab.name() == 'SERIES'}"
                       th:href="${page.createSeriesPath}"
                       class="btn btn-sm btn-primary"
                       data-app-page-navigation
                       hx-boost="true"
                       hx-target="#app-social-page-content"
                       hx-select="#app-social-page-content"
                       hx-swap="outerHTML show:top"
                       hx-push-url="true"
                       hx-replace-url="false">
                        <i class="bi bi-plus-lg me-1" aria-hidden="true"></i>
                        <span th:text="#{video.series.owner.create}">Create series</span>
                    </a>
                </div>
            </header>

            <nav th:if="${page.activeTab.name() == 'VIDEOS'}"
                 class="nav nav-underline flex-nowrap overflow-x-auto">
                <a th:each="status : ${page.videoStatusFilters}"
                   class="nav-link text-nowrap"
                   th:classappend="${status.active} ? ' active' : ''"
                   th:href="${status.path}"
                   hx-push-url="false"
                   hx-replace-url="true"
                   th:text="${status.label}">All</a>
            </nav>
            <nav th:if="${page.activeTab.name() == 'SERIES'}"
                 class="nav nav-underline flex-nowrap overflow-x-auto">
                <a th:each="status : ${page.seriesStatusFilters}"
                   class="nav-link text-nowrap"
                   th:classappend="${status.active} ? ' active' : ''"
                   th:href="${status.path}"
                   hx-push-url="false"
                   hx-replace-url="true"
                   th:text="${status.label}">All</a>
            </nav>

            <form method="get" th:action="${page.searchPath}"
                  class="d-flex gap-2 video-library-search ms-auto"
                  th:attr="hx-get=${page.searchPath},
                           hx-target='#owner-video-results',
                           hx-select='#owner-video-results',
                           hx-swap='outerHTML',
                           hx-push-url='false',
                           hx-replace-url='true'">
                <input class="form-control form-control-sm"
                       type="search" name="title" maxlength="255"
                       th:value="${page.titleQuery}"
                       th:placeholder="#{video.public.searchPlaceholder}">
                <input th:if="${page.videoLifecycleStatus != null}"
                       type="hidden" name="lifecycleStatus"
                       th:value="${page.videoLifecycleStatus}">
                <input th:if="${page.videoModerationStatus != null}"
                       type="hidden" name="moderationStatus"
                       th:value="${page.videoModerationStatus}">
                <input th:if="${page.seriesLifecycleStatus != null}"
                       type="hidden" name="seriesStatus"
                       th:value="${page.seriesLifecycleStatus}">
                <button class="btn btn-sm btn-outline-primary" type="submit">
                    <i class="bi bi-search" aria-hidden="true"></i>
                    <span class="visually-hidden" th:text="#{action.search}">Search</span>
                </button>
            </form>

            <div th:replace="~{post/video/owner/fragments/results
                    :: results(${page})}"></div>
        </div>
    </th:block>
</div>
</body>
</html>
