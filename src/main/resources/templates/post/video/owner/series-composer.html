<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" th:lang="${#locale.language}">
<head>
    <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title th:text="${page.title}">Series composer</title>
    <link rel="icon" href="/favicon.ico" type="image/x-icon">
    <script th:src="@{/js/app-ui.js}"></script>
    <link rel="stylesheet" th:href="@{/vendor/bootstrap/css/bootstrap.min.css}">
    <link rel="stylesheet" th:href="@{/css/app-ui.css}">
    <link rel="stylesheet" th:href="@{/css/social-shell.css}">
    <link rel="stylesheet" th:href="@{/css/video-post.css}">
    <th:block th:replace="~{fragments/app-tools :: htmxScripts}"></th:block>
    <script defer th:src="@{/vendor/bootstrap/js/bootstrap.bundle.min.js}"></script>
    <script type="module" th:src="@{/js/media-upload.js}"></script>
    <script defer th:src="@{/js/app-modal.js}"></script>
    <script defer th:src="@{/js/post-composer.js}"></script>
</head>
<body class="bg-body-tertiary">
<div th:replace="~{fragments/social-shell :: layout(${page.shell}, ~{::pageContent})}">
    <th:block th:fragment="pageContent">
        <div class="video-composer-page mx-auto d-grid gap-3">
            <div th:replace="~{fragments/components/breadcrumb :: breadcrumb(${page.breadcrumb})}"></div>
            <div th:replace="~{post/video/owner/fragments/series-composer :: composer(${page})}"></div>
        </div>
    </th:block>
</div>
</body>
</html>
