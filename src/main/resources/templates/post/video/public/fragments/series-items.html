<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" th:lang="${#locale.language}">
<body>
<div th:fragment="items(cards)" class="d-grid gap-3">
    <a th:each="card : ${cards}"
       th:href="${card.detailPath}"
       class="card app-surface-panel text-decoration-none text-body overflow-hidden"
       th:classappend="${card.active} ? ' border-primary border-2' : ''"
       hx-target="#app-social-workspace"
       hx-select="#app-social-workspace"
       hx-swap="outerHTML show:top"
       hx-replace-url="true"
       th:attr="aria-current=${card.active ? 'page' : null}">
        <div class="row g-0 align-items-center">
            <div class="col-5 col-md-4 col-xl-3">
                <div class="ratio ratio-16x9 bg-black"
                     data-media-gallery-card>
                    <img th:if="${card.item.video.content.media.thumbnailUrl != null}"
                         th:src="${card.item.video.content.media.thumbnailUrl}"
                         th:alt="${card.item.video.title}"
                         class="w-100 h-100 object-fit-cover"
                         loading="lazy">
                    <span th:unless="${card.item.video.content.media.thumbnailUrl != null}"
                          class="d-flex align-items-center justify-content-center text-white">
                        <i class="bi bi-play-circle" aria-hidden="true"></i>
                    </span>
                    <span class="app-media-hover-preview d-none"
                          th:attr="data-media-hover-preview=${card.item.video.content.media.contentUrl}"
                          aria-hidden="true"></span>
                    <span class="video-card-play d-flex align-items-center justify-content-center">
                        <i class="bi bi-play-fill" aria-hidden="true"></i>
                    </span>
                </div>
            </div>
            <div class="col-7 col-md-8 col-xl-9">
                <div class="card-body d-flex align-items-center gap-3 py-2 py-md-3">
                    <span class="badge text-bg-secondary"
                          th:text="${card.item.position + 1}">1</span>
                    <h3 class="h6 text-truncate flex-grow-1 mb-0"
                        th:text="${card.item.video.title}">Video title</h3>
                </div>
            </div>
        </div>
    </a>
</div>
</body>
</html>
