<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      th:lang="${#locale.language}">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title th:text="${page.series.title}">Series</title>
    <link rel="icon" href="/favicon.ico" type="image/x-icon">
    <script th:src="@{/js/app-ui.js}"></script>
    <link rel="stylesheet" th:href="@{/vendor/bootstrap/css/bootstrap.min.css}">
    <link rel="stylesheet" th:href="@{/vendor/bootstrap-icons/font/bootstrap-icons.min.css}">
    <link rel="stylesheet" th:href="@{/vendor/video.js/video-js.min.css}">
    <link rel="stylesheet" th:href="@{/css/app-ui.css}">
    <link rel="stylesheet" th:href="@{/css/social-shell.css}">
    <link rel="stylesheet" th:href="@{/css/video-post.css}">
    <th:block th:replace="~{fragments/app-tools :: htmxScripts}"></th:block>
    <script defer th:src="@{/vendor/bootstrap/js/bootstrap.bundle.min.js}"></script>
    <script defer th:src="@{/vendor/video.js/video.min.js}"></script>
    <script defer th:src="@{/js/media-gallery.js}"></script>
</head>
<body class="bg-body-tertiary">
    <div th:replace="~{fragments/social-shell
            :: layout(${page.shell}, ~{::pageContent})}">
        <th:block th:fragment="pageContent">
            <div class="video-detail-page mx-auto d-grid gap-4">
                <div th:replace="~{fragments/components/breadcrumb
                        :: breadcrumb(${page.breadcrumb})}"></div>
                <section class="card app-surface-panel overflow-hidden">
                    <div class="row g-0">
                        <div class="col-12 col-lg-5">
                            <div class="ratio ratio-16x9 h-100 bg-body-tertiary">
                                <img th:if="${page.series.coverMedia != null and page.series.coverMedia.thumbnailUrl != null}"
                                     th:src="${page.series.coverMedia.thumbnailUrl}"
                                     th:alt="${page.series.title}"
                                     class="w-100 h-100 object-fit-cover">
                                <span th:unless="${page.series.coverMedia != null and page.series.coverMedia.thumbnailUrl != null}"
                                      class="d-flex align-items-center justify-content-center text-secondary">
                                    <i class="bi bi-collection-play display-4" aria-hidden="true"></i>
                                </span>
                            </div>
                        </div>
                        <div class="col-12 col-lg-7">
                            <div class="card-body p-4 h-100 d-flex flex-column">
                                <span class="small text-secondary mb-2"
                                      th:text="#{video.series.videoCount(${page.series.videoCount})}">0 videos</span>
                                <h1 class="h3" th:text="${page.series.title}">Series title</h1>
                                <p class="text-secondary preserve-lines mb-4"
                                   th:if="${page.series.description != null and !page.series.description.isBlank()}"
                                   th:text="${page.series.description}">Description</p>
                                <strong class="mt-auto"
                                        th:text="${page.series.owner.fullName != null and !page.series.owner.fullName.isBlank()
                                                ? page.series.owner.fullName
                                                : #messages.msg('post.public.unknownAuthor')}">Owner</strong>
                            </div>
                        </div>
                    </div>
                </section>

                <section class="d-grid gap-3">
                    <h2 class="h5 mb-0" th:text="#{video.series.items}">Videos</h2>
                    <div th:if="${#lists.isEmpty(page.items)}"
                         class="app-empty-state app-surface-panel"
                         th:text="#{video.series.items.empty}">No videos.</div>
                    <div th:replace="~{post/video/public/fragments/series-items
                            :: items(${page.items})}"></div>
                    <div class="d-flex justify-content-center">
                        <div th:replace="~{fragments/components/pagination
                                :: pagination(${page.pagination})}"></div>
                    </div>
                </section>
            </div>
        </th:block>
    </div>
</body>
</html>
