<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      th:lang="${#locale.language}">
<head>
    <title th:text="${page.video.title}">Video</title>
    <th:block th:replace="~{fragments/app-tools :: socialHead}"></th:block>
</head>
<body class="bg-body-tertiary">
    <div th:replace="~{fragments/social-shell
            :: layout(${page.shell}, 'bg-body-tertiary', ~{::pageContent})}">
        <th:block th:fragment="pageContent">
            <div class="video-detail-page mx-auto d-grid gap-3">
                <div th:replace="~{fragments/components/breadcrumb
                        :: breadcrumb(${page.breadcrumb})}"></div>
                <article class="card app-surface-panel overflow-hidden">
                    <div th:replace="~{post/video/fragments/player
                            :: player(${page.video.content.media}, true)}"></div>
                    <div class="card-body p-4">
                        <h1 class="h3 mb-3" th:text="${page.video.title}">Video title</h1>
                        <div class="d-flex align-items-center gap-3 mb-4">
                            <a th:href="${page.authorPath}"
                               class="d-inline-flex flex-shrink-0 rounded-circle"
                               data-app-page-navigation
                               hx-boost="true"
                               hx-target="#app-social-page-content"
                               hx-select="#app-social-page-content"
                               hx-swap="outerHTML show:top"
                               hx-push-url="true"
                               hx-replace-url="false"
                               th:attr="aria-label=${page.video.post.author.fullName}">
                                <img th:if="${page.video.post.author.avatarUrl != null}"
                                     th:src="${page.video.post.author.avatarUrl}"
                                     class="rounded-circle border object-fit-cover video-author-avatar"
                                     alt="">
                                <span th:unless="${page.video.post.author.avatarUrl != null}"
                                      class="rounded-circle border d-inline-flex align-items-center justify-content-center video-author-avatar">
                                    <i class="bi bi-person" aria-hidden="true"></i>
                                </span>
                            </a>
                            <div>
                                <strong th:text="${page.video.post.author.fullName != null and !page.video.post.author.fullName.isBlank()
                                        ? page.video.post.author.fullName
                                        : #messages.msg('post.public.unknownAuthor')}">Author</strong>
                                <div class="small text-secondary"
                                     th:text="${@uiDateTimeFormatter.format(page.video.post.publishedAt)}">Date</div>
                            </div>
                        </div>
                        <p class="mb-0 text-break preserve-lines"
                           th:if="${page.video.description != null and !page.video.description.isBlank()}"
                           th:text="${page.video.description}">Description</p>
                    </div>
                </article>
                <th:block th:if="${page.playlist != null}">
                    <section id="public-video-playlist" class="d-grid gap-3">
                        <header class="d-flex flex-wrap align-items-center justify-content-between gap-2">
                            <div>
                                <h2 class="h5 mb-1" th:text="${page.playlist.series.title}">Series</h2>
                                <span class="small text-secondary"
                                      th:text="#{video.series.videoCount(${page.playlist.series.videoCount})}">0 videos</span>
                            </div>
                            <div th:replace="~{post/video/fragments/series-sort
                                    :: toggle(${page.playlist.itemSort}, 'public-video-playlist')}"></div>
                        </header>
                        <div th:replace="~{post/video/public/fragments/series-items
                                :: items(${page.playlist.items})}"></div>
                        <div class="d-flex justify-content-center">
                            <div th:replace="~{fragments/components/pagination
                                    :: pagination(${page.playlist.pagination})}"></div>
                        </div>
                    </section>
                </th:block>
            </div>
        </th:block>
    </div>
</body>
</html>
