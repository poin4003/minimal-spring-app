<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      th:lang="${#locale.language}">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title th:text="${page.title}">My Posts</title>
    <link rel="icon" href="/favicon.ico" type="image/x-icon">
    <script th:src="@{/js/app-ui.js}"></script>
    <link rel="stylesheet" th:href="@{/vendor/bootstrap/css/bootstrap.min.css}">
    <link rel="stylesheet" th:href="@{/css/app-ui.css}">
    <link rel="stylesheet" th:href="@{/css/social-shell.css}">
    <link rel="stylesheet" th:href="@{/css/post-public.css}">
    <th:block th:replace="~{fragments/app-tools :: htmxScripts}"></th:block>
    <script defer th:src="@{/vendor/bootstrap/js/bootstrap.bundle.min.js}"></script>
    <script defer th:src="@{/js/app-modal.js}"></script>
</head>
<body class="bg-body-tertiary">
    <div th:replace="~{fragments/social-shell
            :: layout(${page.shell}, ~{::pageContent})}">
        <th:block th:fragment="pageContent">
            <div class="row justify-content-center">
                <div class="col-12 col-xxl-9 d-grid gap-3">
                    <section class="card border-0 shadow-sm">
                        <div class="card-body p-4 d-flex flex-column flex-md-row align-items-center gap-4">
                            <img th:if="${page.profile.avatar != null
                                    and page.profile.avatar.thumbnailUrl != null}"
                                 th:src="${page.profile.avatar.thumbnailUrl}"
                                 th:alt="#{profile.avatar.current}"
                                 class="rounded-circle border object-fit-cover personal-profile-avatar">
                            <span th:unless="${page.profile.avatar != null
                                    and page.profile.avatar.thumbnailUrl != null}"
                                  class="rounded-circle border bg-body-tertiary d-inline-flex align-items-center justify-content-center personal-profile-avatar">
                                <i class="bi bi-person fs-1"
                                   aria-hidden="true"></i>
                            </span>

                            <div class="flex-grow-1 min-w-0 text-center text-md-start">
                                <h1 class="h3 mb-1 text-truncate"
                                    th:text="${page.profile.fullName != null
                                            and !page.profile.fullName.isBlank()
                                            ? page.profile.fullName
                                            : #messages.msg('profile.personal.noName')}">
                                    No name
                                </h1>
                                <p class="text-secondary text-truncate mb-0"
                                   th:text="${page.profile.email}">
                                    user@example.com
                                </p>
                            </div>

                            <div class="d-flex flex-wrap justify-content-center gap-2">
                                <a th:href="${page.editProfilePath}"
                                   class="btn btn-outline-secondary">
                                    <i class="bi bi-pencil me-2"
                                       aria-hidden="true"></i>
                                    <span th:text="#{profile.edit}">
                                        Edit profile
                                    </span>
                                </a>

                                <a th:href="${page.createPath}"
                                   class="btn btn-primary">
                                    <i class="bi bi-plus-lg me-2"
                                       aria-hidden="true"></i>
                                    <span th:text="#{post.composer.open}">
                                        Create post
                                    </span>
                                </a>
                            </div>
                        </div>
                    </section>

                    <h2 class="h4 mt-3 mb-0"
                        th:text="#{post.owner.list.title}">
                        My posts
                    </h2>

                    <nav class="nav nav-pills gap-2"
                         th:aria-label="#{post.owner.contentTypes}">
                        <a class="nav-link active"
                           aria-current="page"
                           th:href="${page.shell.myPostsPath}"
                           th:text="#{post.owner.type.standard}">
                            Posts
                        </a>
                        <a class="nav-link"
                           th:href="${page.shortsPath}"
                           th:text="#{post.owner.type.short}">
                            Shorts
                        </a>
                    </nav>

                    <div th:replace="~{post/standard/owner/fragments/workspace
                            :: workspace(${page.workspace})}"></div>
                </div>
            </div>
        </th:block>
    </div>
</body>
</html>
