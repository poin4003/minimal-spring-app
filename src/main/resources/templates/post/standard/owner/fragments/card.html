<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      th:lang="${#locale.language}">
<body>
    <article th:fragment="card(card, detailMode)"
             class="card border-0 shadow-sm overflow-hidden">
        <div class="card-body p-3 p-md-4">
            <header class="d-flex flex-wrap align-items-center justify-content-between gap-2 mb-3">
                <span class="badge rounded-pill"
                      th:classappend="${card.statusBadgeClass}"
                      th:text="${card.statusLabel}">
                    Status
                </span>
                <time class="small text-secondary"
                      th:datetime="${card.post.createdAt}"
                      th:text="${@uiDateTimeFormatter.format(card.post.createdAt)}">
                    Created time
                </time>
            </header>

            <p th:if="${card.post.content != null and !card.post.content.isBlank()}"
               class="mb-0 post-content"
               th:classappend="${detailMode} ? '' : ' post-content-clamped'"
               th:text="${card.post.content}">
                Post content
            </p>

            <p th:unless="${card.post.content != null and !card.post.content.isBlank()}"
               class="mb-0 text-secondary fst-italic"
               th:text="#{post.owner.content.empty}">
                This post has no text content.
            </p>

            <dl th:if="${detailMode}"
                class="row g-2 small mb-0 mt-4">
                <dt class="col-sm-4 col-lg-3"
                    th:text="#{post.owner.createdAt}">Created</dt>
                <dd class="col-sm-8 col-lg-9"
                    th:text="${@uiDateTimeFormatter.format(card.post.createdAt)}">
                    Created time
                </dd>

                <dt class="col-sm-4 col-lg-3"
                    th:text="#{post.owner.updatedAt}">Updated</dt>
                <dd class="col-sm-8 col-lg-9"
                    th:text="${@uiDateTimeFormatter.format(card.post.updatedAt)}">
                    Updated time
                </dd>

                <th:block th:if="${card.post.publishedAt != null}">
                    <dt class="col-sm-4 col-lg-3"
                        th:text="#{post.owner.publishedAt}">Published</dt>
                    <dd class="col-sm-8 col-lg-9"
                        th:text="${@uiDateTimeFormatter.format(card.post.publishedAt)}">
                        Published time
                    </dd>
                </th:block>
            </dl>

            <div th:if="${detailMode
                    and card.post.moderationStatus.name() == 'REJECTED'}"
                 class="alert alert-danger mb-0 mt-4">
                <strong class="d-block mb-1"
                        th:text="#{post.owner.rejectionReason}">
                    Rejection reason
                </strong>
                <span th:text="${card.post.rejectionReason != null
                        and !card.post.rejectionReason.isBlank()
                        ? card.post.rejectionReason
                        : #messages.msg('post.owner.rejectionReason.empty')}">
                    No reason was provided.
                </span>
            </div>
        </div>

        <div th:if="${detailMode}"
             class="px-3 px-md-4 pb-3 pb-md-4">
            <div th:replace="~{post/standard/public/fragments/media
                    :: detail(${card.post.media})}"></div>
        </div>

        <div th:unless="${detailMode}"
             th:replace="~{post/standard/public/fragments/media
                     :: compact(${card.post.media}, ${card.detailPath})}"></div>

        <footer th:unless="${detailMode}"
                class="card-footer bg-body border-top-0 px-3 px-md-4 py-3">
            <a th:href="${card.detailPath}"
               class="btn btn-sm btn-outline-primary"
               th:text="#{post.owner.viewDetail}">
                View details
            </a>
        </footer>
    </article>
</body>
</html>
