<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      th:lang="${#locale.language}">
<head>
    <title th:text="${page.title}">Post Detail</title>
    <th:block th:replace="~{fragments/app-tools :: socialHead}"></th:block>
</head>
<body class="bg-body-tertiary social-edge-to-edge-mobile standard-post-page">
    <div th:replace="~{fragments/social-shell
            :: layout(${page.shell}, 'bg-body-tertiary social-edge-to-edge-mobile standard-post-page', ~{::pageContent})}">
        <th:block th:fragment="pageContent">
            <div class="row justify-content-center">
                <div class="col-12 col-xxl-10 d-grid gap-3">
                    <div class="px-3 px-md-0">
                        <div th:replace="~{fragments/components/breadcrumb
                                :: breadcrumb(${page.breadcrumb})}"></div>
                    </div>

                    <div th:replace="~{post/standard/public/fragments/card
                            :: card(${page.card}, true)}"></div>
                </div>
            </div>
        </th:block>
    </div>
</body>
</html>
