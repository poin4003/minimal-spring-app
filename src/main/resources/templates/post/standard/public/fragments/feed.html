<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      th:lang="${#locale.language}">
<body>
    <section th:fragment="feed(feed)"
             th:id="${feed.id}"
             class="d-grid gap-4">
        <div th:if="${#lists.isEmpty(feed.posts)}"
             class="card border-0 shadow-sm">
            <div class="card-body p-5 text-center">
                <i class="bi bi-journal-text d-block fs-1 text-secondary mb-3"
                   aria-hidden="true"></i>
                <p class="text-secondary mb-0"
                   th:text="#{post.public.feed.empty}">
                    No published posts yet.
                </p>
            </div>
        </div>

        <th:block th:each="card : ${feed.posts}">
            <div th:replace="~{post/standard/public/fragments/card
                    :: card(${card}, false)}"></div>
        </th:block>

        <div class="d-flex justify-content-center">
            <div th:replace="~{fragments/components/pagination
                    :: pagination(${feed.pagination})}"></div>
        </div>
    </section>
</body>
</html>
