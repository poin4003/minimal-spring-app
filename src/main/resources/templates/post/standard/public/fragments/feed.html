<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      th:lang="${#locale.language}">
<body>
    <section th:fragment="feed(feed)"
             th:id="${feed.id}"
             class="app-page-stack">
        <div th:if="${#lists.isEmpty(feed.posts)}"
             class="app-surface-panel app-empty-state">
            <div>
                <i class="bi bi-journal-text d-block fs-1 text-secondary mb-3"
                   aria-hidden="true"></i>
                <p class="text-secondary mb-0"
                   th:text="#{post.public.feed.empty}">
                    No published posts yet.
                </p>
            </div>
        </div>

        <th:block th:unless="${#lists.isEmpty(feed.posts)}"
                  th:replace="~{post/standard/public/fragments/feed
                          :: items(${feed})}"></th:block>
    </section>

    <th:block th:fragment="items(feed)">
        <th:block th:each="card : ${feed.posts}">
            <div th:replace="~{post/standard/public/fragments/card
                    :: card(${card}, false)}"></div>
        </th:block>

        <div th:if="${feed.nextPagePath != null}"
             class="app-infinite-scroll-sentinel d-flex justify-content-center py-3"
             role="status"
             th:attr="hx-get=${feed.nextPagePath}"
             hx-trigger="intersect once threshold:0.1"
             hx-target="this"
             hx-select="unset"
             hx-swap="outerHTML"
             hx-push-url="false"
             hx-replace-url="false"
             hx-disabled-elt="this"
             hx-indicator="find .spinner-border">
            <span class="spinner-border spinner-border-sm htmx-indicator"
                  aria-hidden="true"></span>
            <span class="visually-hidden" th:text="#{common.loading}">
                Loading
            </span>
        </div>
    </th:block>
</body>
</html>
