<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      th:lang="${#locale.language}">
<body>
    <article th:fragment="card(card, detailMode)"
             class="card app-surface-panel overflow-hidden position-relative post-public-card">
        <div class="card-body p-3 p-md-4">
            <header class="d-flex align-items-center gap-3 mb-3">
                <img th:if="${card.post.post.author.avatarUrl != null}"
                     th:src="${card.post.post.author.avatarUrl}"
                     th:alt="${card.post.post.author.fullName}"
                     class="rounded-circle border object-fit-cover post-author-avatar">
                <span th:unless="${card.post.post.author.avatarUrl != null}"
                      class="rounded-circle border bg-body-tertiary d-inline-flex align-items-center justify-content-center post-author-avatar">
                    <i class="bi bi-person" aria-hidden="true"></i>
                </span>

                <div class="min-w-0">
                    <strong class="d-block text-truncate"
                            th:text="${card.post.post.author.fullName != null
                                    and !card.post.post.author.fullName.isBlank()
                                    ? card.post.post.author.fullName
                                    : #messages.msg('post.public.unknownAuthor')}">
                        Author
                    </strong>
                    <time class="d-block small text-secondary"
                          th:datetime="${card.post.post.publishedAt}"
                          th:text="${@uiDateTimeFormatter.format(card.post.post.publishedAt)}">
                        Published time
                    </time>
                </div>
            </header>

            <p th:if="${card.post.content != null and !card.post.content.isBlank()}"
               class="mb-0 post-content"
               th:classappend="${detailMode} ? '' : ' post-content-clamped'"
               th:text="${card.post.content}">
                Post content
            </p>
        </div>

        <div th:if="${detailMode}"
             class="px-3 px-md-4 pb-3 pb-md-4 post-detail-media">
            <div th:replace="~{post/standard/public/fragments/media
                    :: interactiveDetail(${card.detailMedia},
                            ${card.detailPath})}"></div>
        </div>

        <th:block th:unless="${detailMode}">
            <th:block th:if="${card.singlePlayableMedia != null}">
                <div th:replace="~{post/standard/public/fragments/media
                        :: feedPlayable(${card.singlePlayableMedia})}"></div>
            </th:block>
            <th:block th:unless="${card.singlePlayableMedia != null}">
                <div th:replace="~{post/standard/public/fragments/media
                        :: compact(${card.post.media},
                                   ${card.detailPath},
                                   ${card.mediaGalleryPartialPath})}"></div>
            </th:block>
        </th:block>

        <a th:unless="${detailMode}"
           th:href="${card.detailPath}"
           class="stretched-link"
           th:attr="aria-label=#{post.public.viewDetail}">
            <span class="visually-hidden"
                  th:text="#{post.public.viewDetail}">
                View post
            </span>
        </a>
    </article>
</body>
</html>
