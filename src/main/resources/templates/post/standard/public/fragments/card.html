<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      th:lang="${#locale.language}">
<body>
    <article th:fragment="card(card, detailMode)"
             class="card border-0 shadow-sm overflow-hidden">
        <div class="card-body p-3 p-md-4">
            <header class="d-flex align-items-center gap-3 mb-3">
                <img th:if="${card.post.author.avatarUrl != null}"
                     th:src="${card.post.author.avatarUrl}"
                     th:alt="${card.post.author.fullName}"
                     class="rounded-circle border object-fit-cover post-author-avatar">
                <span th:unless="${card.post.author.avatarUrl != null}"
                      class="rounded-circle border bg-body-tertiary d-inline-flex align-items-center justify-content-center post-author-avatar">
                    <i class="bi bi-person" aria-hidden="true"></i>
                </span>

                <div class="min-w-0">
                    <strong class="d-block text-truncate"
                            th:text="${card.post.author.fullName != null
                                    and !card.post.author.fullName.isBlank()
                                    ? card.post.author.fullName
                                    : #messages.msg('post.public.unknownAuthor')}">
                        Author
                    </strong>
                    <time class="d-block small text-secondary"
                          th:datetime="${card.post.publishedAt}"
                          th:text="${@uiDateTimeFormatter.format(card.post.publishedAt)}">
                        Published time
                    </time>
                </div>
            </header>

            <p th:if="${card.post.content != null and !card.post.content.isBlank()}"
               class="mb-0 post-content"
               th:classappend="${detailMode} ? '' : ' post-content-clamped'"
               th:text="${card.post.content}">
                Post content
            </p>
        </div>

        <div th:if="${detailMode}"
             class="px-3 px-md-4 pb-3 pb-md-4">
            <div th:replace="~{post/standard/public/fragments/media
                    :: detail(${card.post.media})}"></div>
        </div>

        <div th:unless="${detailMode}"
             th:replace="~{post/standard/public/fragments/media
                     :: compact(${card.post.media}, ${card.detailPath})}"></div>

        <footer th:unless="${detailMode}"
                class="card-footer bg-body border-top-0 px-3 px-md-4 py-3">
            <a th:href="${card.detailPath}"
               class="btn btn-sm btn-outline-primary"
               th:text="#{post.public.viewDetail}">
                View post
            </a>
        </footer>
    </article>
</body>
</html>
