<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      th:lang="${#locale.language}">
<head>
    <title th:text="${page.title}">Feed</title>
    <th:block th:replace="~{fragments/app-tools :: socialHead}"></th:block>
</head>
<body class="bg-body-tertiary social-edge-to-edge-mobile standard-post-page">
    <div th:replace="~{fragments/social-shell
            :: layout(${page.shell}, 'bg-body-tertiary social-edge-to-edge-mobile standard-post-page', ~{::pageContent})}">
        <th:block th:fragment="pageContent">
            <div class="row justify-content-center">
                <div class="col-12 col-xxl-9 d-grid gap-4">
                    <th:block th:if="${page.profileHeader != null}">
                        <div th:replace="~{profile/fragments/public-header
                                :: header(${page.profileHeader})}"></div>
                    </th:block>
                    <th:block th:unless="${page.profileHeader != null}">
                        <div th:replace="~{post/fragments/quick-create
                                :: quickCreate(${page.createPath},
                                        ${#messages.msg('post.composer.open')},
                                        'image')}"></div>
                    </th:block>
                    <div th:replace="~{post/standard/public/fragments/feed
                            :: feed(${page.feed})}"></div>
                </div>
            </div>
        </th:block>
    </div>
</body>
</html>
