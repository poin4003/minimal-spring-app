<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      th:lang="${#locale.language}">
<head>
    <title th:text="${page.title}">AI decision history</title>
    <th:block th:replace="~{fragments/app-tools :: adminHead}"></th:block>
</head>
<body class="app-shell bg-body-tertiary">
    <div th:replace="~{fragments/app-shell
            :: layout(${page.shell}, 'app-shell bg-body-tertiary', ~{::pageContent})}">
        <th:block th:fragment="pageContent">
            <div class="app-page-stack">
                <div th:replace="~{fragments/components/breadcrumb
                        :: breadcrumb(${page.breadcrumb})}"></div>

                <div class="app-page-toolbar">
                    <a th:href="${page.moderationPath}"
                       class="btn btn-sm btn-outline-secondary"
                       data-app-page-navigation
                       hx-boost="true"
                       hx-target="#app-page-content"
                       hx-select="#app-page-content"
                       hx-swap="outerHTML show:top"
                       hx-push-url="true"
                       hx-replace-url="false">
                        <i class="bi bi-arrow-left me-2" aria-hidden="true"></i>
                        <span th:text="#{post.aiModeration.log.backToQueue}">
                            Back to moderation queue
                        </span>
                    </a>
                </div>

                <header class="card app-surface-panel app-component">
                    <div class="app-section-header">
                        <h1 class="app-section-title"
                            th:text="${page.title}">
                            AI decision history
                        </h1>
                        <p class="app-section-description mb-0">
                            <span th:text="#{post.aiModeration.log.postId}">
                                Post ID
                            </span>
                            <code class="ms-1" th:text="${page.postId}">id</code>
                        </p>
                    </div>
                </header>

                <div th:replace="~{fragments/components/table
                        :: table(${page.logs})}"></div>
            </div>
        </th:block>
    </div>
</body>
</html>
