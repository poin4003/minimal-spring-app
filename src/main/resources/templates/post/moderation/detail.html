<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      th:lang="${#locale.language}">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title th:text="${page.title}">Post review</title>
    <link rel="icon" href="/favicon.ico" type="image/x-icon">
    <script th:src="@{/js/app-ui.js}"></script>
    <link rel="stylesheet" th:href="@{/vendor/bootstrap/css/bootstrap.min.css}">
    <link rel="stylesheet" th:href="@{/vendor/bootstrap-icons/font/bootstrap-icons.min.css}">
    <link rel="stylesheet" th:href="@{/vendor/video.js/video-js.min.css}">
    <link rel="stylesheet" th:href="@{/css/app-ui.css}">
    <link rel="stylesheet" th:href="@{/css/shell.css}">
    <link rel="stylesheet" th:href="@{/css/post-public.css}">
    <th:block th:replace="~{fragments/app-tools :: htmxScripts}"></th:block>
    <script defer th:src="@{/vendor/bootstrap/js/bootstrap.bundle.min.js}"></script>
    <script defer th:src="@{/vendor/video.js/video.min.js}"></script>
    <script defer th:src="@{/vendor/video.js/videojs-contrib-quality-levels.min.js}"></script>
    <script defer th:src="@{/vendor/video.js/videojs-hls-quality-selector.min.js}"></script>
    <script defer th:src="@{/js/media-preview.js}"></script>
    <script defer th:src="@{/js/app-modal.js}"></script>
</head>
<body class="app-shell bg-body-tertiary">
    <div th:replace="~{fragments/app-shell
            :: layout(${page.shell}, ~{::pageContent})}">
        <th:block th:fragment="pageContent">
            <div id="post-moderation-detail-workspace"
                 class="app-page-stack"
                 th:attr="hx-get=${page.queuePath},
                          hx-trigger=${page.refreshEvent + ' from:body'},
                           hx-target='#app-page-content',
                           hx-select='#post-moderation-page-content',
                           hx-swap='innerHTML',
                           hx-replace-url='false'">
                <div th:replace="~{fragments/components/breadcrumb
                        :: breadcrumb(${page.breadcrumb})}"></div>

                <div class="app-page-toolbar">
                    <a th:href="${page.queuePath}"
                       class="btn btn-sm btn-outline-secondary"
                       hx-push-url="true"
                       hx-replace-url="false"
                       th:text="#{post.moderation.backToQueue}">
                        Back to queue
                    </a>
                    <button type="button"
                            class="btn btn-sm btn-outline-danger"
                            data-bs-toggle="modal"
                            th:data-bs-target="${'#' + page.rejectModal.id}">
                        <i class="bi bi-x-circle me-2" aria-hidden="true"></i>
                        <span th:text="#{action.reject}">Reject</span>
                    </button>
                    <button type="button"
                            class="btn btn-sm btn-success"
                            data-bs-toggle="modal"
                            th:data-bs-target="${'#' + page.publishModal.id}">
                        <i class="bi bi-check-circle me-2" aria-hidden="true"></i>
                        <span th:text="#{action.publish}">Publish</span>
                    </button>
                </div>

                <article class="card app-surface-panel app-component overflow-hidden">
                    <div class="app-section-body">
                        <header class="d-flex flex-wrap align-items-center justify-content-between gap-3 mb-4">
                            <div class="d-flex align-items-center gap-3 min-w-0">
                                <img th:if="${page.post.post.author.avatarUrl != null}"
                                     th:src="${page.post.post.author.avatarUrl}"
                                     th:alt="${page.post.post.author.fullName}"
                                     class="rounded-circle border object-fit-cover post-author-avatar">
                                <span th:unless="${page.post.post.author.avatarUrl != null}"
                                      class="rounded-circle border bg-body-tertiary d-inline-flex align-items-center justify-content-center post-author-avatar">
                                    <i class="bi bi-person" aria-hidden="true"></i>
                                </span>
                                <div class="min-w-0">
                                    <strong class="d-block text-truncate"
                                            th:text="${page.post.post.author.fullName != null
                                                    and !page.post.post.author.fullName.isBlank()
                                                    ? page.post.post.author.fullName
                                                    : #messages.msg('post.public.unknownAuthor')}">
                                        Author
                                    </strong>
                                    <code class="small"
                                          th:text="${page.post.post.author.id}">
                                        Author ID
                                    </code>
                                </div>
                            </div>
                            <span class="badge rounded-pill text-bg-warning"
                                  th:text="${page.statusLabel}">
                                Pending review
                            </span>
                        </header>

                        <h1 th:if="${page.post.title != null and !page.post.title.isBlank()}"
                            class="h4 mb-3"
                            th:text="${page.post.title}">
                            Video title
                        </h1>

                        <p th:if="${page.post.content != null and !page.post.content.isBlank()}"
                           class="post-content mb-0"
                           th:text="${page.post.content}">
                            Post content
                        </p>
                        <p th:unless="${page.post.content != null and !page.post.content.isBlank()}"
                           class="text-secondary fst-italic mb-0"
                           th:text="#{post.moderation.detail.emptyContent}">
                            This post has no text content.
                        </p>

                        <dl class="row g-2 small mb-0 mt-4">
                            <dt class="col-sm-4 col-lg-3"
                                th:text="#{post.moderation.detail.postId}">Post ID</dt>
                            <dd class="col-sm-8 col-lg-9">
                                <code th:text="${page.post.post.id}">Post ID</code>
                            </dd>
                            <dt class="col-sm-4 col-lg-3"
                                th:text="#{post.moderation.detail.type}">Type</dt>
                            <dd class="col-sm-8 col-lg-9"
                                th:text="${page.post.post.type}">STANDARD</dd>
                            <dt class="col-sm-4 col-lg-3"
                                th:text="#{post.moderation.detail.createdAt}">Submitted</dt>
                            <dd class="col-sm-8 col-lg-9"
                                th:text="${@uiDateTimeFormatter.format(page.post.state.createdAt)}">
                                Submitted time
                            </dd>
                            <dt class="col-sm-4 col-lg-3"
                                th:text="#{post.moderation.detail.updatedAt}">Updated</dt>
                            <dd class="col-sm-8 col-lg-9"
                                th:text="${@uiDateTimeFormatter.format(page.post.state.updatedAt)}">
                                Updated time
                            </dd>
                        </dl>
                    </div>

                    <div th:if="${not #lists.isEmpty(page.post.media)}"
                         class="app-section-body border-top">
                        <h2 class="h5 mb-3"
                            th:text="#{post.moderation.detail.media}">
                            Attached media
                        </h2>
                        <div th:replace="~{post/standard/public/fragments/media
                                :: detail(${page.post.media})}"></div>
                    </div>
                </article>
            </div>

            <div th:if="${page.publishModal != null}">
                <div th:replace="~{fragments/components/confirm-modal
                        :: modal(${page.publishModal})}"></div>
            </div>
            <div th:if="${page.rejectModal != null}">
                <div th:replace="~{fragments/components/modal
                        :: modal(${page.rejectModal})}"></div>
            </div>

            <script th:if="${page.openModalId != null}"
                    th:inline="javascript">
                document.addEventListener("DOMContentLoaded", function () {
                    const modalElement = document.getElementById(
                            /*[[${page.openModalId}]]*/ "");
                    if (modalElement != null) {
                        bootstrap.Modal
                                .getOrCreateInstance(modalElement)
                                .show();
                    }
                });
            </script>
        </th:block>
    </div>
</body>
</html>
