<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      th:lang="${#locale.language}">
<body>
    <section th:fragment="composer(page)"
             id="post-composer"
             class="card border-0 shadow-sm"
             data-post-composer
             th:data-max-media-count="${page.maxMediaCount}"
             th:data-message-limit="#{post.composer.media.limit(${page.maxMediaCount})}">
        <form th:object="${form}"
              method="post"
              th:action="${page.actionPath}"
              th:attr="hx-post=${page.actionPath},
                       hx-target='#post-composer',
                       hx-swap='outerHTML',
                       hx-disabled-elt='button[type=submit]'">
            <div class="card-body p-3 p-md-4 d-grid gap-4">
                <div>
                    <h1 class="h4 mb-1" th:text="${page.heading}">
                        Create short
                    </h1>
                    <p class="text-secondary mb-0"
                       th:text="${page.description}">
                        Choose a video and save a draft.
                    </p>
                </div>

                <div>
                    <label for="short-caption"
                           class="form-label"
                           th:text="#{short.composer.caption}">
                        Caption
                    </label>
                    <textarea id="short-caption"
                              class="form-control"
                              th:classappend="${#fields.hasErrors('caption')}
                                      ? ' is-invalid' : ''"
                              th:field="*{caption}"
                              rows="4"
                              maxlength="1000"
                              th:placeholder="#{short.composer.captionPlaceholder}"></textarea>
                    <div class="invalid-feedback"
                         th:if="${#fields.hasErrors('caption')}"
                         th:errors="*{caption}">
                        Invalid caption
                    </div>
                    <div class="form-text"
                         th:text="#{short.composer.captionHint}">
                        Up to 1,000 characters.
                    </div>
                </div>

                <select th:field="*{mediaId}"
                        hidden
                        data-selected-media-inputs>
                    <option th:if="*{mediaId != null}"
                            th:value="*{mediaId}"
                            th:text="*{mediaId}"
                            selected>
                    </option>
                </select>

                <div class="alert alert-warning mb-0"
                     data-media-selection-error
                     hidden></div>
                <div class="text-danger small"
                     th:if="${#fields.hasErrors('mediaId')}"
                     th:errors="*{mediaId}">
                    Select one video
                </div>

                <div class="alert alert-info d-flex gap-2 mb-0" role="note">
                    <i class="bi bi-info-circle flex-shrink-0" aria-hidden="true"></i>
                    <span th:text="${page.policyHint}">
                        Short video policy
                    </span>
                </div>

                <section class="d-grid gap-3">
                    <div class="d-flex flex-wrap align-items-center justify-content-between gap-3">
                        <div>
                            <h2 class="h5 mb-1"
                                th:text="#{short.composer.mediaLibrary}">
                                Choose a video
                            </h2>
                            <p class="small text-secondary mb-0"
                               th:text="#{short.composer.mediaLibraryHint}">
                                Only active, ready videos are shown.
                            </p>
                        </div>

                        <a th:href="${page.actionPath}"
                           class="btn btn-outline-primary"
                           th:attr="hx-get=${page.uploadPartialPath},
                                    hx-target='#app-modal-host',
                                    hx-swap='innerHTML',
                                    hx-disabled-elt='this',
                                    data-app-modal-request='true'">
                            <i class="bi bi-cloud-arrow-up me-2" aria-hidden="true"></i>
                            <span th:text="#{post.composer.uploadMedia}">
                                Upload media
                            </span>
                        </a>
                    </div>

                    <div th:replace="~{post/fragments/media-picker
                            :: picker(${page.mediaPicker})}"></div>
                </section>
            </div>

            <div class="card-footer bg-body d-flex flex-wrap justify-content-end gap-2 p-3 p-md-4">
                <a th:href="${page.backPath}"
                   class="btn btn-outline-secondary"
                   th:text="#{action.cancel}">
                    Cancel
                </a>
                <button type="submit" class="btn btn-primary">
                    <i class="bi bi-floppy me-2" aria-hidden="true"></i>
                    <span th:text="${page.submitLabel}">Save draft</span>
                </button>
            </div>
        </form>
    </section>
</body>
</html>
