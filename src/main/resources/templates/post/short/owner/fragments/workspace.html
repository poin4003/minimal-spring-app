<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      th:lang="${#locale.language}">
<body>
    <section th:fragment="workspace(workspace)"
             th:id="${workspace.id}"
             class="app-page-stack post-owner-workspace"
             hx-disinherit="hx-target hx-select hx-swap"
             th:attr="hx-get=${workspace.refreshPath},
                      hx-trigger=${workspace.refreshEvent + ' from:body'},
                      hx-target='this',
                      hx-swap='outerHTML'">
        <nav class="post-owner-status-navigation"
             th:aria-label="#{post.owner.filter.label}">
            <ul class="nav nav-underline flex-nowrap gap-3 overflow-x-auto social-status-tabs">
                <li th:each="statusFilter : ${workspace.statusFilters}"
                    class="nav-item">
                    <a th:href="${statusFilter.path}"
                       th:text="${statusFilter.label}"
                       class="nav-link text-nowrap"
                       th:classappend="${statusFilter.active} ? ' active' : ''"
                       th:attr="aria-current=${statusFilter.active ? 'page' : null},
                                hx-get=${statusFilter.path},
                                hx-target=${'#' + workspace.id},
                                hx-select=${'#' + workspace.id},
                                hx-swap='outerHTML',
                                hx-replace-url='true'">
                        All
                    </a>
                </li>
            </ul>
        </nav>

        <div th:if="${#lists.isEmpty(workspace.shorts)}"
             class="app-surface-panel app-empty-state">
            <div>
                <i class="bi bi-play-btn d-block fs-1 text-secondary mb-3"
                   aria-hidden="true"></i>
                <p class="text-secondary mb-0"
                   th:text="#{short.owner.list.empty}">
                    No shorts match this status.
                </p>
            </div>
        </div>

        <div th:unless="${#lists.isEmpty(workspace.shorts)}"
             class="row g-4 post-owner-short-grid">
            <div th:each="card : ${workspace.shorts}"
                 class="col-12 col-md-6 col-xl-4">
                <div th:replace="~{post/short/owner/fragments/card
                        :: card(${card}, false)}"></div>
            </div>
        </div>

        <div class="d-flex justify-content-center">
            <div th:replace="~{fragments/components/pagination
                    :: pagination(${workspace.pagination})}"></div>
        </div>
    </section>
</body>
</html>
