<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      th:lang="${#locale.language}">
<body>
    <section th:fragment="feed(feed)"
             th:id="${feed.id}"
             class="short-detail-feed"
             data-short-detail-feed>
        <th:block th:replace="~{post/short/public/fragments/detail-feed
                :: items(${feed})}"></th:block>
    </section>

    <th:block th:fragment="items(feed)"
              th:with="loadTriggerIndex=${#lists.size(feed.shorts) > 2
                      ? #lists.size(feed.shorts) - 3
                      : #lists.size(feed.shorts) - 1}">
        <div th:each="card, iteration : ${feed.shorts}"
             class="short-detail-feed-item"
             th:attr="data-short-active=${card.post.post.id.equals(feed.activePostId)},
                      hx-get=${iteration.index == loadTriggerIndex
                              ? feed.nextPagePath : null},
                      hx-trigger=${iteration.index == loadTriggerIndex
                              and feed.nextPagePath != null
                              ? 'intersect once root:#' + feed.id
                              + ' threshold:0.25, short:load-more once'
                              : null},
                      hx-target=${iteration.index == loadTriggerIndex
                              and feed.nextPagePath != null
                              ? '#' + feed.id
                              : null},
                      hx-swap=${iteration.index == loadTriggerIndex
                              and feed.nextPagePath != null
                              ? 'beforeend'
                              : null},
                      hx-indicator=${iteration.index == loadTriggerIndex
                              and feed.nextPagePath != null
                              ? 'find .short-detail-feed-loader'
                              : null}"
             hx-push-url="false"
             hx-replace-url="false">
            <div th:replace="~{post/short/public/fragments/player
                    :: player(${card})}"></div>

            <div th:if="${iteration.index == loadTriggerIndex
                    and feed.nextPagePath != null}"
                 class="short-detail-feed-loader htmx-indicator"
                 role="status">
                <span class="spinner-border spinner-border-sm"
                      aria-hidden="true"></span>
                <span class="visually-hidden" th:text="#{common.loading}">
                    Loading
                </span>
            </div>
        </div>
    </th:block>
</body>
</html>
