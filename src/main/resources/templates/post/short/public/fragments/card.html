<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      th:lang="${#locale.language}">
<body>
    <article th:fragment="card(card, detailMode)"
             class="card border-0 shadow-sm overflow-hidden short-card"
             data-feed-playback>
        <div class="short-video-stage bg-black"
             data-media-preview
             th:data-message-source-unavailable="#{media.preview.sourceUnavailable}"
             th:data-message-player-unavailable="#{media.preview.playerUnavailable}"
             th:data-message-stream-failed="#{media.preview.streamFailed}">
            <div class="app-media-preview-player h-100"
                 data-media-preview-player>
                <video class="video-js vjs-big-play-centered short-video-player"
                       controls
                       playsinline
                       preload="metadata"
                       data-video-player
                       data-auto-initialize
                       th:poster="${card.post.media.media.thumbnailUrl}"
                       th:attr="data-video-source=${card.post.media.media.contentUrl},
                                data-media-progress-id=${card.post.media.media.id},
                                muted=${detailMode ? null : 'muted'},
                                data-feed-autoplay=${detailMode ? null : 'true'}"></video>
                <div class="alert alert-danger m-3"
                     data-video-error
                     hidden></div>
            </div>
        </div>

        <div class="card-body p-3 p-md-4">
            <a th:href="${card.detailPath}"
               class="d-flex align-items-center gap-3 text-body text-decoration-none mb-3">
                <img th:if="${card.post.post.author.avatarUrl != null}"
                     th:src="${card.post.post.author.avatarUrl}"
                     th:alt="${card.post.post.author.fullName}"
                     class="rounded-circle border object-fit-cover short-author-avatar">
                <span th:unless="${card.post.post.author.avatarUrl != null}"
                      class="rounded-circle border bg-body-tertiary d-inline-flex align-items-center justify-content-center short-author-avatar">
                    <i class="bi bi-person" aria-hidden="true"></i>
                </span>
                <span class="min-w-0">
                    <strong class="d-block text-truncate"
                            th:text="${card.post.post.author.fullName != null
                                    and !card.post.post.author.fullName.isBlank()
                                    ? card.post.post.author.fullName
                                    : #messages.msg('post.public.unknownAuthor')}">
                        Author
                    </strong>
                    <time class="d-block small text-secondary"
                          th:datetime="${card.post.post.publishedAt}"
                          th:text="${@uiDateTimeFormatter.format(card.post.post.publishedAt)}">
                        Published time
                    </time>
                </span>
            </a>

            <a th:if="${card.post.caption != null and !card.post.caption.isBlank()}"
               th:href="${card.detailPath}"
               class="d-block text-body text-decoration-none post-content"
               th:classappend="${detailMode} ? '' : ' post-content-clamped'"
               th:text="${card.post.caption}">
                Caption
            </a>
        </div>
    </article>
</body>
</html>
