<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      th:lang="${#locale.language}">
<body>
    <section th:fragment="gallery(gallery)"
             th:id="${gallery.id}"
             class="app-page-stack">
        <div th:if="${#lists.isEmpty(gallery.shorts)}"
             class="app-surface-panel app-empty-state">
            <div>
                <i class="bi bi-play-btn d-block fs-1 text-secondary mb-3"
                   aria-hidden="true"></i>
                <p class="text-secondary mb-0"
                   th:text="#{short.public.feed.empty}">
                    No published shorts yet.
                </p>
            </div>
        </div>

        <div th:unless="${#lists.isEmpty(gallery.shorts)}"
             class="row row-cols-2 row-cols-md-3 row-cols-xl-4 g-3 g-lg-4 short-gallery-grid">
            <th:block th:replace="~{post/short/public/fragments/gallery
                    :: items(${gallery})}"></th:block>
        </div>
    </section>

    <th:block th:fragment="items(gallery)">
        <div class="col" th:each="card : ${gallery.shorts}">
            <div th:replace="~{post/short/public/fragments/gallery-card
                    :: card(${card})}"></div>
        </div>

        <div th:if="${gallery.nextPagePath != null}"
             class="app-infinite-scroll-sentinel col-12 d-flex justify-content-center py-3"
             role="status"
             th:attr="hx-get=${gallery.nextPagePath}"
             hx-trigger="intersect once threshold:0.1"
             hx-target="this"
             hx-swap="outerHTML"
             hx-disabled-elt="this"
             hx-indicator="find .spinner-border">
            <span class="spinner-border spinner-border-sm htmx-indicator"
                  aria-hidden="true"></span>
            <span class="visually-hidden" th:text="#{common.loading}">
                Loading
            </span>
        </div>
    </th:block>
</body>
</html>
