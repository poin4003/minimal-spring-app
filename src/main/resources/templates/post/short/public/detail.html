<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      th:lang="${#locale.language}">
<head>
    <title th:text="${page.title}">Short detail</title>
    <th:block th:replace="~{fragments/app-tools :: socialHead}"></th:block>
</head>
<body class="bg-body-tertiary social-edge-to-edge-mobile short-public-page short-detail-page">
    <div th:replace="~{fragments/social-shell
            :: layout(${page.shell}, 'bg-body-tertiary social-edge-to-edge-mobile short-public-page short-detail-page', ~{::pageContent})}">
        <th:block th:fragment="pageContent">
            <div class="row justify-content-center">
                <div class="col-12 col-xl-10 col-xxl-8 d-grid gap-2">
                    <div class="px-3 px-md-0">
                        <div th:replace="~{fragments/components/breadcrumb
                                :: breadcrumb(${page.breadcrumb})}"></div>
                    </div>
                    <div th:replace="~{post/short/public/fragments/detail-feed
                            :: feed(${page.feed})}"></div>
                </div>
            </div>
        </th:block>
    </div>
</body>
</html>
