<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      th:lang="${#locale.language}">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title th:text="${page.title}">Short detail</title>
    <link rel="icon" href="/favicon.ico" type="image/x-icon">
    <script th:src="@{/js/app-ui.js}"></script>
    <link rel="stylesheet" th:href="@{/vendor/bootstrap/css/bootstrap.min.css}">
    <link rel="stylesheet" th:href="@{/vendor/video.js/video-js.min.css}">
    <link rel="stylesheet" th:href="@{/css/app-ui.css}">
    <link rel="stylesheet" th:href="@{/css/social-shell.css}">
    <link rel="stylesheet" th:href="@{/css/post-public.css}">
    <link rel="stylesheet" th:href="@{/css/short-post.css}">
    <th:block th:replace="~{fragments/app-tools :: frontendScripts}"></th:block>
    <script defer th:src="@{/vendor/bootstrap/js/bootstrap.bundle.min.js}"></script>
    <script defer th:src="@{/vendor/video.js/video.min.js}"></script>
    <script defer th:src="@{/vendor/video.js/videojs-contrib-quality-levels.min.js}"></script>
    <script defer th:src="@{/vendor/video.js/videojs-hls-quality-selector.min.js}"></script>
    <script defer th:src="@{/js/media-preview.js}"></script>
    <script defer th:src="@{/js/post-feed-playback.js}"></script>
    <script defer th:src="@{/js/short-detail-feed.js}"></script>
    <script defer th:src="@{/js/app-modal.js}"></script>
</head>
<body class="bg-body-tertiary social-edge-to-edge-mobile short-public-page short-detail-page">
    <div th:replace="~{fragments/social-shell
            :: layout(${page.shell}, ~{::pageContent})}">
        <th:block th:fragment="pageContent">
            <div class="row justify-content-center">
                <div class="col-12 col-xl-10 col-xxl-8 d-grid gap-2">
                    <div class="px-3 px-md-0">
                        <div th:replace="~{fragments/components/breadcrumb
                                :: breadcrumb(${page.breadcrumb})}"></div>
                    </div>
                    <div th:replace="~{post/short/public/fragments/detail-feed
                            :: feed(${page.feed})}"></div>
                </div>
            </div>
        </th:block>
    </div>
</body>
</html>
