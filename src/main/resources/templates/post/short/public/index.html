<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      th:lang="${#locale.language}">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title th:text="${page.title}">Shorts</title>
    <link rel="icon" href="/favicon.ico" type="image/x-icon">
    <script th:src="@{/js/app-ui.js}"></script>
    <link rel="stylesheet" th:href="@{/vendor/bootstrap/css/bootstrap.min.css}">
    <link rel="stylesheet" th:href="@{/css/app-ui.css}">
    <link rel="stylesheet" th:href="@{/css/social-shell.css}">
    <th:block th:replace="~{fragments/app-tools :: frontendScripts}"></th:block>
</head>
<body class="bg-body-tertiary social-edge-to-edge-mobile short-public-page">
    <div th:replace="~{fragments/social-shell
            :: layout(${page.shell}, ~{::pageContent})}">
        <th:block th:fragment="pageContent">
            <div class="app-page-stack">
                <div th:if="${page.createPath != null}"
                     class="app-page-toolbar px-3 px-md-0">
                    <a th:href="${page.createPath}"
                       class="btn btn-sm btn-primary">
                        <i class="bi bi-plus-lg me-2" aria-hidden="true"></i>
                        <span th:text="#{short.public.create}">Create short</span>
                    </a>
                </div>

                <div th:replace="~{post/short/public/fragments/gallery
                        :: gallery(${page.gallery})}"></div>
            </div>
        </th:block>
    </div>
</body>
</html>
