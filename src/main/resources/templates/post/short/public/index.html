<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      th:lang="${#locale.language}">
<head>
    <title th:text="${page.title}">Shorts</title>
    <th:block th:replace="~{fragments/app-tools :: socialHead}"></th:block>
</head>
<body class="bg-body-tertiary social-edge-to-edge-mobile short-public-page">
    <div th:replace="~{fragments/social-shell
            :: layout(${page.shell}, 'bg-body-tertiary social-edge-to-edge-mobile short-public-page', ~{::pageContent})}">
        <th:block th:fragment="pageContent">
            <div class="app-page-stack">
                <div th:if="${page.createPath != null}"
                     class="app-page-toolbar px-3 px-md-0">
                    <a th:href="${page.createPath}"
                       class="btn btn-sm btn-primary"
                       data-app-page-navigation
                       hx-boost="true"
                       hx-target="#app-social-page-content"
                       hx-select="#app-social-page-content"
                       hx-swap="outerHTML show:top"
                       hx-push-url="true">
                        <i class="bi bi-plus-lg me-2" aria-hidden="true"></i>
                        <span th:text="#{short.public.create}">Create short</span>
                    </a>
                </div>

                <div th:replace="~{post/short/public/fragments/gallery
                        :: gallery(${page.gallery})}"></div>
            </div>
        </th:block>
    </div>
</body>
</html>
