<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" th:lang="${#locale.language}">
<head>
    <title th:text="${page.title}">Catalog categories</title>
    <th:block th:replace="~{fragments/app-tools :: adminHead}"></th:block>
</head>
<body class="app-shell bg-body-tertiary">
<div th:replace="~{fragments/app-shell
        :: layout(${page.shell}, 'app-shell bg-body-tertiary', ~{::pageContent})}">
    <th:block th:fragment="pageContent">
        <div class="app-page-stack">
            <div class="d-flex flex-wrap align-items-center justify-content-between gap-3">
                <div>
                    <h1 class="h3 mb-1" th:text="#{catalog.category.page.heading}">Categories</h1>
                    <p class="text-secondary mb-0" th:text="#{catalog.category.page.description}">
                        Configure the catalog category tree.
                    </p>
                </div>
                <a class="btn btn-outline-primary"
                   th:href="${page.attributePath}"
                   th:text="#{catalog.navigation.attributes}">Attributes</a>
            </div>

            <section class="card app-panel-card">
                <div class="card-header bg-transparent">
                    <h2 class="h5 mb-0"
                        th:text="${page.editId == null
                                ? #messages.msg('catalog.category.create.title')
                                : #messages.msg('catalog.category.edit.title')}">
                        Category form
                    </h2>
                </div>
                <div class="card-body">
                    <form method="get" class="row g-2 align-items-end mb-3">
                        <input th:if="${page.editId != null}" type="hidden"
                               name="editId" th:value="${page.editId}">
                        <div class="col-md-8">
                            <label class="form-label" for="category-parent-search"
                                   th:text="#{catalog.category.parentSearch}">Find parent</label>
                            <input id="category-parent-search" class="form-control"
                                   type="search" name="parentText"
                                   th:value="${page.parentText}"
                                   th:placeholder="#{catalog.category.parentSearchPlaceholder}">
                        </div>
                        <div class="col-md-4 d-grid">
                            <button class="btn btn-outline-secondary" type="submit"
                                    th:text="#{action.search}">Search</button>
                        </div>
                    </form>
                    <form method="post"
                          th:action="${page.editId == null
                                  ? page.basePath
                                  : page.basePath + '/' + page.editId}"
                          th:object="${form}">
                        <input th:if="${_csrf != null}" type="hidden"
                               th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
                        <input type="hidden" name="parentText"
                               th:value="${page.parentText}">
                        <div class="row g-3">
                            <div class="col-md-6">
                                <label class="form-label" for="category-name"
                                       th:text="#{catalog.field.name}">Name</label>
                                <input id="category-name" class="form-control" type="text"
                                       th:field="*{name}" maxlength="150" required>
                                <div class="text-danger small mt-1"
                                     th:if="${page.fieldErrors['name'] != null}"
                                     th:text="${page.fieldErrors['name']}"></div>
                            </div>
                            <div class="col-md-6">
                                <label class="form-label" for="category-slug"
                                       th:text="#{catalog.field.slug}">Slug</label>
                                <input id="category-slug" class="form-control" type="text"
                                       th:field="*{slug}" maxlength="160" required>
                                <div class="text-danger small mt-1"
                                     th:if="${page.fieldErrors['slug'] != null}"
                                     th:text="${page.fieldErrors['slug']}"></div>
                            </div>
                            <div class="col-md-8">
                                <label class="form-label" for="category-parent"
                                       th:text="#{catalog.field.parentCategory}">Parent</label>
                                <select id="category-parent" class="form-select" th:field="*{parentId}">
                                    <option value="" th:text="#{catalog.category.root}">Root category</option>
                                    <option th:each="parent : ${page.parentOptions}"
                                            th:value="${parent.id}"
                                            th:text="${parent.name}">Parent</option>
                                </select>
                            </div>
                            <div class="col-md-4">
                                <label class="form-label" for="category-order"
                                       th:text="#{catalog.field.sortOrder}">Sort order</label>
                                <input id="category-order" class="form-control" type="number"
                                       min="0" th:field="*{sortOrder}" required>
                                <div class="text-danger small mt-1"
                                     th:if="${page.fieldErrors['sortOrder'] != null}"
                                     th:text="${page.fieldErrors['sortOrder']}"></div>
                            </div>
                            <div class="col-12">
                                <label class="form-label" for="category-description"
                                       th:text="#{catalog.field.description}">Description</label>
                                <textarea id="category-description" class="form-control" rows="3"
                                          th:field="*{description}"></textarea>
                            </div>
                        </div>
                        <div class="d-flex gap-2 mt-3">
                            <button type="submit" class="btn btn-primary"
                                    th:text="${page.editId == null
                                            ? #messages.msg('catalog.action.create')
                                            : #messages.msg('action.saveChanges')}">Save</button>
                            <a th:if="${page.editId != null}" class="btn btn-outline-secondary"
                               th:href="${page.basePath}" th:text="#{action.cancel}">Cancel</a>
                        </div>
                    </form>
                </div>
            </section>

            <section id="catalog-category-list" class="card app-panel-card">
                <div class="card-body border-bottom">
                    <form method="get" class="row g-2 align-items-end" th:object="${filter}">
                        <div class="col-md-7">
                            <label class="form-label" for="category-filter"
                                   th:text="#{action.search}">Search</label>
                            <input id="category-filter" class="form-control" type="search"
                                   th:field="*{text}" th:placeholder="#{catalog.category.searchPlaceholder}">
                        </div>
                        <div class="col-md-3">
                            <label class="form-label" for="category-status"
                                   th:text="#{field.status}">Status</label>
                            <select id="category-status" class="form-select" th:field="*{status}">
                                <option value="" th:text="#{catalog.filter.allStatuses}">All</option>
                                <option th:each="status : ${T(com.app.core.enums.RecordStatus).values()}"
                                        th:value="${status}" th:text="${status}">ACTIVE</option>
                            </select>
                        </div>
                        <div class="col-md-2 d-grid">
                            <button class="btn btn-outline-primary" type="submit"
                                    th:text="#{action.search}">Search</button>
                        </div>
                    </form>
                </div>
                <div class="table-responsive">
                    <table class="table align-middle mb-0">
                        <thead><tr>
                            <th th:text="#{catalog.field.name}">Name</th>
                            <th th:text="#{catalog.field.slug}">Slug</th>
                            <th th:text="#{catalog.field.parentCategory}">Parent</th>
                            <th th:text="#{catalog.field.sortOrder}">Order</th>
                            <th th:text="#{field.status}">Status</th>
                            <th class="text-end" th:text="#{field.actions}">Actions</th>
                        </tr></thead>
                        <tbody>
                        <tr th:if="${#lists.isEmpty(page.categories)}">
                            <td colspan="6" class="text-center text-secondary py-4"
                                th:text="#{catalog.category.empty}">No categories.</td>
                        </tr>
                        <tr th:each="category : ${page.categories}">
                            <td class="fw-semibold" th:text="${category.name}">Name</td>
                            <td><code th:text="${category.slug}">slug</code></td>
                            <td th:text="${category.parentName ?: '-'}">-</td>
                            <td th:text="${category.sortOrder}">0</td>
                            <td><span class="badge"
                                      th:classappend="${category.status.name() == 'ACTIVE'
                                              ? ' text-bg-success' : ' text-bg-secondary'}"
                                      th:text="${category.status}">ACTIVE</span></td>
                            <td class="text-end">
                                <div class="btn-group btn-group-sm">
                                    <a class="btn btn-outline-primary"
                                       th:href="${page.basePath + '?editId=' + category.id}"
                                       th:text="#{action.edit}">Edit</a>
                                    <a class="btn btn-outline-secondary"
                                       th:href="${page.basePath + '/' + category.id + '/attributes'}"
                                       th:text="#{catalog.category.configureAttributes}">Schema</a>
                                    <form method="post"
                                          th:action="${page.basePath + '/' + category.id + '/status'}">
                                        <input th:if="${_csrf != null}" type="hidden"
                                               th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
                                        <input type="hidden" name="status"
                                               th:value="${category.status.name() == 'ACTIVE'
                                                       ? 'INACTIVE' : 'ACTIVE'}">
                                        <button type="submit" class="btn"
                                                th:classappend="${category.status.name() == 'ACTIVE'
                                                        ? ' btn-outline-danger' : ' btn-outline-success'}"
                                                th:text="${category.status.name() == 'ACTIVE'
                                                        ? #messages.msg('catalog.action.inactivate')
                                                        : #messages.msg('catalog.action.activate')}">
                                            Toggle
                                        </button>
                                    </form>
                                </div>
                            </td>
                        </tr>
                        </tbody>
                    </table>
                </div>
                <div class="card-footer bg-transparent d-flex justify-content-end">
                    <div th:replace="~{fragments/components/pagination
                            :: pagination(${page.pagination})}"></div>
                </div>
            </section>
        </div>
    </th:block>
</div>
</body>
</html>
