<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title th:text="${page.title}">Select Avatar</title>
    <link rel="icon" href="/favicon.ico" type="image/x-icon">
    <script th:src="@{/js/app-ui.js}"></script>
    <link rel="stylesheet" th:href="@{/vendor/bootstrap/css/bootstrap.min.css}">
    <link rel="stylesheet" th:href="@{/css/app-ui.css}">
    <link rel="stylesheet" th:href="@{/css/shell.css}">
    <th:block th:replace="~{fragments/app-tools :: htmxScripts}"></th:block>
    <script defer th:src="@{/vendor/bootstrap/js/bootstrap.bundle.min.js}"></script>
    <script type="module" th:src="@{/js/media-upload.js}"></script>
    <script defer th:src="@{/js/app-modal.js}"></script>
</head>
<body class="app-shell bg-body-tertiary"
      hx-ext="sse"
      th:attr="sse-connect=${page.shell.notificationWidget.streamPath}">
    <div class="container-fluid px-0 py-0">
        <div class="row g-0 align-items-stretch app-shell-row">
            <aside class="col-12 col-lg-3 col-xxl-2">
                <div class="card app-sidebar-panel shadow-sm border-0">
                    <div class="card-body p-3 p-lg-4">
                        <p class="app-menu-caption mb-2">Menu</p>
                        <h1 class="h3 mb-2" th:text="${page.shell.title}">
                            Minimal Spring App
                        </h1>
                        <p class="text-secondary mb-4">Internal control panel</p>
                        <div th:replace="~{fragments/menu
                                :: tree(${page.shell.menuTree})}"></div>
                    </div>
                </div>
            </aside>

            <section class="col-12 col-lg-9 col-xxl-10">
                <div class="card app-content-panel shadow-sm border-0">
                    <div class="card-body p-0">
                        <div th:replace="~{fragments/app-header
                                :: header(${page.shell})}"></div>

                        <main class="p-4 p-lg-5 d-grid gap-4">
                            <div th:replace="~{fragments/components/breadcrumb
                                    :: breadcrumb(${page.breadcrumb})}"></div>

                            <div class="d-flex justify-content-end">
                                <a class="btn btn-primary"
                                   th:href="${page.listPath}"
                                   th:attr="hx-get=${page.uploadPartialPath},
                                            hx-target='#app-modal-host',
                                            hx-swap='innerHTML',
                                            hx-disabled-elt='this',
                                            data-app-modal-request='true'">
                                    Upload Avatar Image
                                </a>
                            </div>

                            <div id="profile-avatar-workspace"
                                 class="d-grid gap-4">
                                <section class="card shadow-sm border-0">
                                    <div class="card-body p-4">
                                        <form method="get"
                                              th:action="${page.listPath}"
                                              th:attr="hx-get=${page.listPath},
                                                       hx-target='#profile-avatar-workspace',
                                                       hx-select='#profile-avatar-workspace',
                                                       hx-swap='outerHTML',
                                                       hx-push-url='true',
                                                       hx-disabled-elt='button[type=submit]'"
                                              class="row g-3 align-items-end">
                                            <input type="hidden" name="page" value="0">

                                            <div class="col-12 col-lg-8">
                                                <label for="avatar-original-name"
                                                       class="form-label">
                                                    Image Name
                                                </label>
                                                <input id="avatar-original-name"
                                                       name="originalName"
                                                       type="text"
                                                       class="form-control"
                                                       maxlength="255"
                                                       placeholder="Search your ready images"
                                                       th:value="${page.filter.originalName}">
                                            </div>

                                            <div class="col-12 col-lg-4 d-flex justify-content-lg-end gap-2">
                                                <a class="btn btn-outline-secondary"
                                                   th:href="${page.listPath}"
                                                   th:attr="hx-get=${page.listPath},
                                                            hx-target='#profile-avatar-workspace',
                                                            hx-select='#profile-avatar-workspace',
                                                            hx-swap='outerHTML',
                                                            hx-push-url='true',
                                                            hx-disabled-elt='this'">
                                                    Clear
                                                </a>
                                                <button type="submit"
                                                        class="btn btn-primary">
                                                    Search
                                                </button>
                                            </div>
                                        </form>
                                    </div>
                                </section>

                                <div th:replace="~{fragments/components/assignment-panel
                                        :: panel(${page.assignmentPanel})}"></div>
                            </div>
                        </main>
                    </div>
                </div>
            </section>
        </div>
    </div>

    <div th:replace="~{fragments/app-tools :: modalHost}"></div>
    <div th:replace="~{fragments/app-tools :: loader}"></div>
</body>
</html>
