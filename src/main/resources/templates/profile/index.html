<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      th:lang="${#locale.language}">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title th:text="${page.title}">Profile Settings</title>
    <link rel="icon" href="/favicon.ico" type="image/x-icon">
    <script th:src="@{/js/app-ui.js}"></script>
    <link rel="stylesheet" th:href="@{/vendor/bootstrap/css/bootstrap.min.css}">
    <link rel="stylesheet" th:href="@{/css/app-ui.css}">
    <link rel="stylesheet" th:href="@{/css/social-shell.css}">
    <th:block th:replace="~{fragments/app-tools :: htmxScripts}"></th:block>
    <script defer th:src="@{/vendor/bootstrap/js/bootstrap.bundle.min.js}"></script>
</head>
<body class="bg-body-tertiary">
    <div th:replace="~{fragments/social-shell
            :: layout(${page.shell}, ~{::pageContent})}">
        <th:block th:fragment="pageContent">
            <div class="row g-4">
                                <div class="col-12 col-xl-4">
                                    <section class="card h-100 shadow-sm border-0">
                                        <div class="card-body p-4 d-grid gap-4">
                                            <div class="text-center">
                                                <a th:href="${page.avatarSelectionPath}"
                                                   class="position-relative d-inline-block rounded-circle"
                                                   th:attr="aria-label=#{profile.avatar.change},
                                                            title=#{profile.avatar.change}">
                                                    <img th:if="${page.profile.avatar != null
                                                            and page.profile.avatar.thumbnailUrl != null}"
                                                         th:src="${page.profile.avatar.thumbnailUrl}"
                                                         th:alt="#{profile.avatar.current}"
                                                         class="rounded-circle border object-fit-cover"
                                                         width="160"
                                                         height="160">
                                                    <span th:unless="${page.profile.avatar != null
                                                            and page.profile.avatar.thumbnailUrl != null}"
                                                          class="d-inline-flex align-items-center justify-content-center rounded-circle border bg-body-tertiary"
                                                          style="width: 160px; height: 160px;">
                                                        <i class="bi bi-person fs-1"
                                                           aria-hidden="true"></i>
                                                    </span>
                                                    <span class="position-absolute bottom-0 end-0 d-inline-flex align-items-center justify-content-center rounded-circle border border-3 border-secondary bg-primary text-white p-2">
                                                        <i class="bi bi-camera"
                                                           aria-hidden="true"></i>
                                                    </span>
                                                </a>
                                            </div>

                                            <div class="d-flex justify-content-center">
                                                <form th:if="${page.profile.avatar != null}"
                                                      method="post"
                                                      class="mb-0"
                                                      th:action="${page.removeAvatarPath}"
                                                      th:attr="hx-post=${page.removeAvatarPath},
                                                               hx-swap='none',
                                                               hx-disabled-elt='button[type=submit]'">
                                                    <input type="hidden"
                                                           th:name="${_csrf.parameterName}"
                                                           th:value="${_csrf.token}">
                                                    <button type="submit"
                                                            class="btn btn-outline-danger d-inline-flex align-items-center gap-2">
                                                        <i class="bi bi-trash"
                                                           aria-hidden="true"></i>
                                                        <span th:text="#{profile.avatar.remove}">
                                                            Remove Avatar
                                                        </span>
                                                    </button>
                                                </form>
                                            </div>
                                        </div>
                                    </section>
                                </div>

                                <div class="col-12 col-xl-8">
                                    <section id="profile-settings"
                                             class="card shadow-sm border-0">
                                        <div class="card-body p-4">
                                            <form method="post"
                                                  th:action="${page.updatePath}"
                                                  th:object="${profileForm}"
                                                  th:attr="hx-post=${page.updatePath},
                                                           hx-target='#profile-settings',
                                                           hx-select='#profile-settings',
                                                           hx-swap='outerHTML',
                                                           hx-disabled-elt='button[type=submit]'"
                                                  class="d-grid gap-4">
                                                <input type="hidden"
                                                       th:name="${_csrf.parameterName}"
                                                       th:value="${_csrf.token}">

                                                <div>
                                                    <label for="profile-email"
                                                           class="form-label"
                                                           th:text="#{field.email}">
                                                        Email
                                                    </label>
                                                    <input id="profile-email"
                                                           type="email"
                                                           class="form-control"
                                                           th:value="${page.profile.email}"
                                                           disabled>
                                                </div>

                                                <div>
                                                    <label for="profile-full-name"
                                                           class="form-label"
                                                           th:text="#{profile.fullName}">
                                                        Full Name
                                                    </label>
                                                    <input id="profile-full-name"
                                                           type="text"
                                                           class="form-control"
                                                           th:classappend="${#fields.hasErrors('fullName')}
                                                                   ? ' is-invalid'"
                                                           th:field="*{fullName}"
                                                           maxlength="150"
                                                           autocomplete="name">
                                                    <div class="invalid-feedback"
                                                         th:errors="*{fullName}">
                                                        Invalid full name.
                                                    </div>
                                                </div>

                                                <div>
                                                    <label for="profile-language"
                                                           class="form-label"
                                                           th:text="#{profile.language}">
                                                        Language
                                                    </label>
                                                    <select id="profile-language"
                                                            class="form-select"
                                                            th:classappend="${#fields.hasErrors('language')}
                                                                    ? ' is-invalid'"
                                                            th:field="*{language}">
                                                        <option th:each="language : ${T(com.app.core.enums.AppLanguage).values()}"
                                                                th:value="${language}"
                                                                th:text="#{${language.messageKey}}">
                                                            EN
                                                        </option>
                                                    </select>
                                                    <div class="invalid-feedback"
                                                         th:errors="*{language}">
                                                        Invalid language.
                                                    </div>
                                                </div>

                                                <div class="form-check form-switch">
                                                    <input id="profile-dark-theme"
                                                           type="checkbox"
                                                           class="form-check-input"
                                                           role="switch"
                                                           th:field="*{darkThemeEnabled}">
                                                    <label for="profile-dark-theme"
                                                           class="form-check-label"
                                                           th:text="#{profile.darkTheme}">
                                                        Prefer dark theme
                                                    </label>
                                                </div>

                                                <div class="d-flex justify-content-end">
                                                    <button type="submit"
                                                            class="btn btn-primary"
                                                            th:text="#{profile.save}">
                                                        Save Changes
                                                    </button>
                                                </div>
                                            </form>
                                        </div>
                                    </section>
                                </div>
            </div>
        </th:block>
    </div>

</body>
</html>
