<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title th:text="${page.title}">Profile Settings</title>
    <link rel="icon" href="/favicon.ico" type="image/x-icon">
    <script th:src="@{/js/app-ui.js}"></script>
    <link rel="stylesheet" th:href="@{/vendor/bootstrap/css/bootstrap.min.css}">
    <link rel="stylesheet" th:href="@{/css/app-ui.css}">
    <link rel="stylesheet" th:href="@{/css/shell.css}">
    <th:block th:replace="~{fragments/app-tools :: htmxScripts}"></th:block>
    <script defer th:src="@{/vendor/bootstrap/js/bootstrap.bundle.min.js}"></script>
</head>
<body class="app-shell bg-body-tertiary"
      hx-ext="sse"
      th:attr="sse-connect=${page.shell.notificationWidget.streamPath}">
    <div class="container-fluid px-0 py-0">
        <div class="row g-0 align-items-stretch app-shell-row">
            <aside class="col-12 col-lg-3 col-xxl-2">
                <div class="card app-sidebar-panel shadow-sm border-0">
                    <div class="card-body p-3 p-lg-4">
                        <p class="app-menu-caption mb-2">Menu</p>
                        <h1 class="h3 mb-2" th:text="${page.shell.title}">
                            Minimal Spring App
                        </h1>
                        <p class="text-secondary mb-4">Internal control panel</p>
                        <div th:replace="~{fragments/menu
                                :: tree(${page.shell.menuTree})}"></div>
                    </div>
                </div>
            </aside>

            <section class="col-12 col-lg-9 col-xxl-10">
                <div class="card app-content-panel shadow-sm border-0">
                    <div class="card-body p-0">
                        <div th:replace="~{fragments/app-header
                                :: header(${page.shell})}"></div>

                        <main class="p-4 p-lg-5">
                            <div class="row g-4">
                                <div class="col-12 col-xl-4">
                                    <section class="card h-100 shadow-sm border-0">
                                        <div class="card-body p-4 d-grid gap-4">
                                            <div class="text-center">
                                                <img th:if="${page.profile.avatar != null
                                                        and page.profile.avatar.thumbnailUrl != null}"
                                                     th:src="${page.profile.avatar.thumbnailUrl}"
                                                     alt="Current avatar"
                                                     class="rounded-circle border object-fit-cover"
                                                     width="160"
                                                     height="160">
                                                <div th:unless="${page.profile.avatar != null
                                                        and page.profile.avatar.thumbnailUrl != null}"
                                                     class="d-inline-flex align-items-center justify-content-center rounded-circle border bg-body-tertiary"
                                                     aria-label="No avatar"
                                                     style="width: 160px; height: 160px;">
                                                    <i class="bi bi-person fs-1"
                                                       aria-hidden="true"></i>
                                                </div>
                                            </div>

                                            <div class="d-grid gap-2">
                                                <a class="btn btn-outline-primary"
                                                   th:href="${page.avatarSelectionPath}">
                                                    Choose Avatar
                                                </a>
                                                <form th:if="${page.profile.avatar != null}"
                                                      method="post"
                                                      th:action="${page.removeAvatarPath}"
                                                      th:attr="hx-post=${page.removeAvatarPath},
                                                               hx-swap='none',
                                                               hx-disabled-elt='button[type=submit]'">
                                                    <input type="hidden"
                                                           th:name="${_csrf.parameterName}"
                                                           th:value="${_csrf.token}">
                                                    <button type="submit"
                                                            class="btn btn-outline-danger w-100">
                                                        Remove Avatar
                                                    </button>
                                                </form>
                                            </div>
                                        </div>
                                    </section>
                                </div>

                                <div class="col-12 col-xl-8">
                                    <section id="profile-settings"
                                             class="card shadow-sm border-0">
                                        <div class="card-body p-4">
                                            <form method="post"
                                                  th:action="${page.updatePath}"
                                                  th:object="${profileForm}"
                                                  th:attr="hx-post=${page.updatePath},
                                                           hx-target='#profile-settings',
                                                           hx-select='#profile-settings',
                                                           hx-swap='outerHTML',
                                                           hx-disabled-elt='button[type=submit]'"
                                                  class="d-grid gap-4">
                                                <input type="hidden"
                                                       th:name="${_csrf.parameterName}"
                                                       th:value="${_csrf.token}">

                                                <div>
                                                    <label for="profile-email"
                                                           class="form-label">
                                                        Email
                                                    </label>
                                                    <input id="profile-email"
                                                           type="email"
                                                           class="form-control"
                                                           th:value="${page.profile.email}"
                                                           disabled>
                                                </div>

                                                <div>
                                                    <label for="profile-full-name"
                                                           class="form-label">
                                                        Full Name
                                                    </label>
                                                    <input id="profile-full-name"
                                                           type="text"
                                                           class="form-control"
                                                           th:classappend="${#fields.hasErrors('fullName')}
                                                                   ? ' is-invalid'"
                                                           th:field="*{fullName}"
                                                           maxlength="150"
                                                           autocomplete="name">
                                                    <div class="invalid-feedback"
                                                         th:errors="*{fullName}">
                                                        Invalid full name.
                                                    </div>
                                                </div>

                                                <div>
                                                    <label for="profile-language"
                                                           class="form-label">
                                                        Language
                                                    </label>
                                                    <select id="profile-language"
                                                            class="form-select"
                                                            th:classappend="${#fields.hasErrors('language')}
                                                                    ? ' is-invalid'"
                                                            th:field="*{language}">
                                                        <option th:each="language : ${T(com.app.core.enums.AppLanguage).values()}"
                                                                th:value="${language}"
                                                                th:text="${language}">
                                                            EN
                                                        </option>
                                                    </select>
                                                    <div class="invalid-feedback"
                                                         th:errors="*{language}">
                                                        Invalid language.
                                                    </div>
                                                </div>

                                                <div class="form-check form-switch">
                                                    <input id="profile-dark-theme"
                                                           type="checkbox"
                                                           class="form-check-input"
                                                           role="switch"
                                                           th:field="*{darkThemeEnabled}">
                                                    <label for="profile-dark-theme"
                                                           class="form-check-label">
                                                        Prefer dark theme
                                                    </label>
                                                </div>

                                                <div class="d-flex justify-content-end">
                                                    <button type="submit"
                                                            class="btn btn-primary">
                                                        Save Changes
                                                    </button>
                                                </div>
                                            </form>
                                        </div>
                                    </section>
                                </div>
                            </div>
                        </main>
                    </div>
                </div>
            </section>
        </div>
    </div>

    <div th:replace="~{fragments/app-tools :: modalHost}"></div>
    <div th:replace="~{fragments/app-tools :: loader}"></div>
</body>
</html>
