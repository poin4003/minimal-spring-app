<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" th:lang="${#locale.language}">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title th:text="${page.title}">Users</title>
    <link rel="icon" href="/favicon.ico" type="image/x-icon">
    <script th:src="@{/js/app-ui.js}"></script>
    <link rel="stylesheet" th:href="@{/vendor/bootstrap/css/bootstrap.min.css}">
    <link rel="stylesheet" th:href="@{/css/app-ui.css}">
    <link rel="stylesheet" th:href="@{/css/shell.css}">
    <th:block th:replace="~{fragments/app-tools :: htmxScripts}"></th:block>
    <script defer th:src="@{/vendor/bootstrap/js/bootstrap.bundle.min.js}"></script>
    <script defer th:src="@{/js/app-modal.js}"></script>
</head>
<body class="app-shell bg-body-tertiary">
    <div th:replace="~{fragments/app-shell
            :: layout(${page.shell}, ~{::pageContent})}">
        <th:block th:fragment="pageContent">
            <div class="d-grid gap-4">
                            <div th:if="${page.createUserModal != null}"
                                 class="d-flex justify-content-end">
                                <div th:replace="~{fragments/components/modal :: modal(${page.createUserModal})}"></div>
                            </div>

                            <div th:if="${page.errorMessage != null}"
                                 class="alert alert-danger mb-0"
                                 th:text="${page.errorMessage}">
                                Please correct the form and try again.
                            </div>

                            <div th:replace="~{fragments/components/table :: table(${page.userTable})}"></div>

                            <th:block th:if="${page.metadataModal != null}">
                                <div th:replace="~{fragments/components/metadata-modal :: modal(${page.metadataModal})}"></div>
                            </th:block>

                            <th:block th:if="${page.detailModal != null}">
                                <div th:replace="~{fragments/components/modal :: modal(${page.detailModal})}"></div>
                            </th:block>
            </div>
        </th:block>
    </div>

    <script th:if="${page.openCreateUserModal}">
        document.addEventListener("DOMContentLoaded", function () {
            bootstrap.Modal.getOrCreateInstance(document.getElementById("create-user-modal")).show();
        });
    </script>

    <script th:if="${page.openMetadataModal}">
        document.addEventListener("DOMContentLoaded", function () {
            bootstrap.Modal.getOrCreateInstance(document.getElementById("user-metadata-modal")).show();
        });
    </script>

    <script th:if="${page.openDetailModal}">
        document.addEventListener("DOMContentLoaded", function () {
            bootstrap.Modal.getOrCreateInstance(document.getElementById("user-detail-modal")).show();
        });
    </script>
</body>
</html>
