<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" th:lang="${#locale.language}">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title th:text="${page.shell.title}">Home</title>
    <link rel="icon" href="/favicon.ico" type="image/x-icon">
    <script th:src="@{/js/app-ui.js}"></script>
    <link rel="stylesheet" th:href="@{/vendor/bootstrap/css/bootstrap.min.css}">
    <link rel="stylesheet" th:href="@{/css/app-ui.css}">
    <link rel="stylesheet" th:href="@{/css/shell.css}">
    <th:block th:replace="~{fragments/app-tools :: htmxScripts}"></th:block>
    <script defer th:src="@{/vendor/bootstrap/js/bootstrap.bundle.min.js}"></script>
</head>
<body class="app-shell bg-body-tertiary">
    <div th:replace="~{fragments/app-shell
            :: layout(${page.shell}, ~{::pageContent})}">
        <th:block th:fragment="pageContent">
            <div class="d-grid gap-4">
                            <section class="row g-4">
                                <div class="col-md-4">
                                    <article class="card h-100 shadow-sm border-0">
                                        <div class="card-body">
                                            <h3 class="h5">Users</h3>
                                            <p class="text-secondary mb-0">
                                                Next step is `UserPageController` and templates under `templates/user/`.
                                            </p>
                                        </div>
                                    </article>
                                </div>

                                <div class="col-md-4">
                                    <article class="card h-100 shadow-sm border-0">
                                        <div class="card-body">
                                            <h3 class="h5">RBAC</h3>
                                            <p class="text-secondary mb-0">
                                                Roles and permissions pages should live under `features/rbac/web/controller`.
                                            </p>
                                        </div>
                                    </article>
                                </div>

                                <div class="col-md-4">
                                    <article class="card h-100 shadow-sm border-0">
                                        <div class="card-body">
                                            <h3 class="h5">Cronjobs</h3>
                                            <p class="text-secondary mb-0">
                                                Scheduler management pages should live under `features/cronjob/web/controller`.
                                            </p>
                                        </div>
                                    </article>
                                </div>
                            </section>

                            <section class="card shadow-sm border-0">
                                <div class="card-body p-4">
                                    <h3 class="h5 mb-3">Authorities</h3>
                                    <div class="d-flex flex-wrap gap-2">
                                        <span class="badge text-bg-primary"
                                              th:each="authority : ${page.shell.currentUser.authorities}"
                                              th:text="${authority}">
                                            ROLE_ADMIN
                                        </span>
                                    </div>
                                </div>
                            </section>
            </div>
        </th:block>
    </div>
</body>
</html>
