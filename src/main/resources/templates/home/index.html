<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" th:lang="${#locale.language}">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title th:text="${page.shell.title}">Home</title>
    <link rel="icon" href="/favicon.ico" type="image/x-icon">
    <script th:src="@{/js/app-ui.js}"></script>
    <link rel="stylesheet" th:href="@{/vendor/bootstrap/css/bootstrap.min.css}">
    <link rel="stylesheet" th:href="@{/css/app-ui.css}">
    <link rel="stylesheet" th:href="@{/css/shell.css}">
    <th:block th:replace="~{fragments/app-tools :: frontendScripts}"></th:block>
</head>
<body class="app-shell bg-body-tertiary">
    <div th:replace="~{fragments/app-shell
            :: layout(${page.shell}, ~{::pageContent})}">
        <th:block th:fragment="pageContent">
            <div class="app-page-stack">
                            <section class="row g-3">
                                <div class="col-md-4">
                                    <article class="card app-summary-card">
                                        <div class="card-body">
                                            <h3 class="h5" th:text="#{home.users.title}">
                                                Users
                                            </h3>
                                            <p class="text-secondary mb-0"
                                               th:text="#{home.users.description}">
                                                Manage user accounts.
                                            </p>
                                        </div>
                                    </article>
                                </div>

                                <div class="col-md-4">
                                    <article class="card app-summary-card">
                                        <div class="card-body">
                                            <h3 class="h5" th:text="#{home.rbac.title}">
                                                RBAC
                                            </h3>
                                            <p class="text-secondary mb-0"
                                               th:text="#{home.rbac.description}">
                                                Manage roles and permissions.
                                            </p>
                                        </div>
                                    </article>
                                </div>

                                <div class="col-md-4">
                                    <article class="card app-summary-card">
                                        <div class="card-body">
                                            <h3 class="h5" th:text="#{home.cronjobs.title}">
                                                Cronjobs
                                            </h3>
                                            <p class="text-secondary mb-0"
                                               th:text="#{home.cronjobs.description}">
                                                Manage recurring jobs.
                                            </p>
                                        </div>
                                    </article>
                                </div>
                            </section>

                            <section class="app-surface-panel app-component">
                                <div class="app-section-header">
                                    <h3 class="app-section-title" th:text="#{home.authorities}">
                                        Authorities
                                    </h3>
                                </div>
                                <div class="app-section-body">
                                    <div class="d-flex flex-wrap gap-2">
                                        <span class="badge text-bg-secondary"
                                              th:each="authority : ${page.shell.currentUser.authorities}"
                                              th:text="${authority}">
                                            ROLE_ADMIN
                                        </span>
                                    </div>
                                </div>
                            </section>
            </div>
        </th:block>
    </div>
</body>
</html>
